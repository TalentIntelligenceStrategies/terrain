            <!-- THE GATE'S PRIMARY ACTION LIVES HERE, NOT IN THE CARD · 2026-09-11.
                 It sat at the foot of the confirm card, one card boundary above the
                 composer — so the two things the founder may do, approve or say what
                 is off, were in different places. They are one decision, so they are
                 one zone: the card ends at the gate and the commitment sits under the
                 thing that offers the alternative.

                 FULL WIDTH, and that is the departure from .cf-actions' note-left /
                 CTA-right idiom. The send arrow already owns the bottom-right corner;
                 a right-aligned pill directly beneath it reads as a second send.

                 NO TRANSITION. design-language.md §7 — the confirm card enters as one
                 message and its rows do not stagger; a dock bar animating on its own
                 would be a second thing moving for the same reason.

                 It is also where #convNote sits on the empty screen, so the promise
                 "we'll ask you to approve the criteria" becomes the button that asks.
                 The two never collide: .conv.has-thread hides the note.          -->
            <div class="dock-act" id="dockAct" hidden>
              <button class="btn btn-primary" id="cfApprove" data-cf-approve="create">
                <span id="cfApproveLabel">Approve and search</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
            </div>
            <p class="conv-note" id="convNote">We’ll ask you to approve the criteria before we search.</p>
          </div>
        </div>

      </div>
      <div class="conv-foot"><em>Powered by</em><img class="foot-mark foot-mark-light" src="../brand/logos/innovue/Innovue_Logo_Blue_eng_inline.svg" alt="Innovue" width="95" height="13"><img class="foot-mark foot-mark-dark" src="../brand/logos/innovue/Innovue_Logo_Light_eng_inline.svg" alt="Innovue" width="95" height="13"></div>
    </div>
