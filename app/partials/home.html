<!-- THE HOME SURFACE · platform.md §3, in the V8 lab's language.
     The heading, the technology fields, the search panel the results surface
     carries, and what the corpus covers, in that order down the page. The one
     credit to Innovue is the foot of this page (brief.md §3). -->
  <section class="view" data-view="home" aria-label="Search">
    <main class="home" id="home">
      <div class="home-col">
        <h1 tabindex="-1" id="homeHeading">What are you building?</h1>
        <p class="home-sub">Describe it in a sentence, or paste a patent number. TIS&nbsp;Terrain finds the patents
           closest to it&nbsp;— and gives you the data to take anywhere.</p>
      </div>

      <!-- aria-disabled, NOT disabled, on a field that is not ready: a disabled
           button leaves the tab order, and a keyboard could never reach the tile
           that says the field is coming. -->
      <div class="home-col">
        <h2 class="glabel fields-lbl" id="fieldsLbl">Patent technology fields</h2>
        <div class="fields" id="fields" role="group" aria-labelledby="fieldsLbl"></div>
      </div>

      <div class="home-col">
        <form class="search panel" role="search" id="homeSearch" data-composer="home">
          <div class="q">
            <div class="seg" role="group" aria-label="Search by">
              <button type="button" data-mode="text" aria-pressed="true">Text</button><button type="button" data-mode="number" aria-pressed="false">Patent number</button>
            </div>
            <div class="sentence">
              <label><span class="sr-only">Describe what you are building</span>
                <textarea rows="2" maxlength="5000" placeholder="For example: a folding drone arm that locks without a latch"></textarea></label>
            </div>
            <button class="go" type="submit"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="label">Search</span></button>
            <p class="q-note" role="status"></p>
          </div>
          <dl class="scope" aria-label="Searches within">
            <div><dt>Field</dt><dd data-scope="field"></dd></div>
            <div><dt>Offices</dt><dd data-scope="offices"></dd></div>
            <div><dt>Documents</dt><dd data-scope="docs"></dd></div>
            <div><dt>Dates</dt><dd data-scope="dates"></dd></div>
            <div><dt>Results</dt><dd data-scope="n" class="tnum"></dd></div>
            <div class="took"></div>
            <div class="end anchor" data-settings-anchor></div>
          </dl>
        </form>
      </div>

      <div class="home-col">
        <section class="panel cover" id="coverCard" aria-labelledby="coverH">
          <div class="cover-head">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
            <h2 id="coverH">Data coverage</h2>
          </div>
          <div class="cover-body" id="coverBody">
            <p class="cover-scope" id="coverScope"></p>
            <table class="cover-tbl">
              <thead><tr><th class="flabel" scope="col">Source</th><th class="flabel num" scope="col">Grants</th><th class="flabel num" scope="col">Applications</th></tr></thead>
              <tbody id="coverRows"></tbody>
            </table>
          </div>
        </section>
      </div>

      <div class="home-foot"><em>Powered by</em><img class="foot-mark foot-mark-light" src="../brand/logos/innovue/Innovue_Logo_Blue_eng_inline.svg" alt="Innovue" width="95" height="13"><img class="foot-mark foot-mark-dark" src="../brand/logos/innovue/Innovue_Logo_Light_eng_inline.svg" alt="Innovue" width="95" height="13"></div>
    </main>
  </section>
