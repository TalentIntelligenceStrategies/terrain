<!-- THE HOME SURFACE · platform.md §3, a copy of Innovue's live home
     (terrain.innovue.ltd), value for value. The heading, the technology
     fields, the composer and what the index covers, in that order down the
     page; below 640px the composer comes before the fields, and the fields
     become one scrolling row of chips. The one credit to Innovue is the foot
     of this page (brief.md §3). -->
  <section class="view" data-view="home" aria-label="Search">
    <main class="home" id="home">
      <div class="home-col">
        <h1 tabindex="-1" id="homeHeading">What are you building?</h1>
        <p class="home-sub">Describe it in a sentence, or paste a patent number. TIS&nbsp;Terrain finds the patents
           closest to it&nbsp;— and gives you the data to take anywhere.</p>
      </div>

      <!-- aria-disabled, NOT disabled, on a field that is not ready: a disabled
           button leaves the tab order, and a keyboard could never reach the tile
           that says the field is coming. -->
      <div class="home-col home-fields">
        <h2 class="fields-lbl" id="fieldsLbl">Patent technology fields</h2>
        <div class="fields" id="fields" role="group" aria-labelledby="fieldsLbl"></div>
      </div>

      <!-- THE COMPOSER IS INNOVUE'S (terrain.innovue.ltd): the sentence, a count of
           what it may hold, then Text / Patent number and the settings beside it,
           and Search at the far end, quiet until there is something to search. -->
      <div class="home-col home-q">
        <form class="hs panel" role="search" id="homeSearch" data-composer="home">
          <label><span class="sr-only">Describe the technology</span>
            <textarea rows="2" maxlength="5000" placeholder="Describe the technology, e.g. hinge structure for foldable displays"></textarea></label>
          <p class="hs-count mono" aria-hidden="true"><span data-count>0</span> / 5000</p>
          <div class="hs-row">
            <div class="seg hs-seg" role="group" aria-label="Search by">
              <button type="button" data-mode="text" aria-pressed="true" aria-label="Text"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16"/><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M9 20h6"/></svg><span class="label">Text</span></button><button type="button" data-mode="number" aria-pressed="false" aria-label="Patent number"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg><span class="label">Patent number</span></button>
            </div>
            <div class="anchor hs-set" data-settings-anchor></div>
            <button class="go hs-go" type="submit" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="label">Search</span></button>
          </div>
          <p class="q-note" role="status"></p>
        </form>
      </div>

      <div class="home-col home-cover">
        <section class="panel cover" id="coverCard" aria-labelledby="coverH">
          <h2 id="coverH">Data coverage</h2>
          <p class="cover-cap">Latest publication · Grant / Application</p>
          <div class="cover-body" id="coverBody">
            <table class="cover-tbl">
              <thead><tr><th class="flabel" scope="col">Source</th><th class="flabel num" scope="col">Grant</th><th class="flabel num" scope="col">Application</th></tr></thead>
              <tbody id="coverRows"></tbody>
            </table>
          </div>
        </section>
      </div>

      <div class="home-foot"><em>Powered by</em><img class="foot-mark foot-mark-light" src="../brand/logos/innovue/Innovue_Logo_Blue_eng_inline.svg" alt="Innovue" width="95" height="13"><img class="foot-mark foot-mark-dark" src="../brand/logos/innovue/Innovue_Logo_Light_eng_inline.svg" alt="Innovue" width="95" height="13"></div>
    </main>
  </section>
