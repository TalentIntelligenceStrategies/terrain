<!-- EXTRACTED from design/previews/terrain-prototype.html lines 5280-5372.
     The prototype is the reference; where this and it disagree, it is
     right and this is stale. The gate card and the build block, moved into whichever thread needs them rather than duplicated -- same component, same gate, in the DOM. -->
  <!-- ══ parked components ════════════════════════════════════════════════
       Moved into whichever thread needs them rather than duplicated, so the
       confirm card on the map is literally the same node as the one in the
       conversation — "same component, same gate" in the DOM, not by
       resemblance. Only one is ever active at a time.                      -->
  <div id="parked" hidden>

    <!-- ONE TENANT NOW. The approval gate's card and the build block lived
         here too, hidden, after the analysis layer left — markup nobody
         rendered, kept in case the decision came back. It did not, and a
         retired component sitting in the DOM is a component the next reader
         has to work out the status of. Git has them.

         WHAT IS LEFT IS NOT RETIRED, it is PARKED: settings.mjs moves #setPop
         out of here and under whichever composer anchors it. It ships inside a
         [hidden] container so it cannot flash on first paint before that move
         happens. -->
    <div class="pop pop-set" id="setPop" role="group" aria-labelledby="setPopTitle">
      <h2 class="pop-title t-micro" id="setPopTitle">Search settings</h2>
      <!-- ONLY THE SECTIONS SCROLL. The panel is capped to the room its
           anchor actually has, so on a short window the content overflows —
           and when the whole panel was the scroller, Reset and Done went
           under the fold. A form whose confirm button has to be scrolled to
           is a form people abandon at the last step. -->
      <div class="pop-body">

      <!-- MULTI-SELECT, SO NOT THE ACCENT. §3.8 gives the accent the SELECTED
           state of a segmented control — one of these, not six at once. Six
           filled chips would be the accent describing data rather than a
           control, which §3.8 bars by name. The tick is what says chosen, and
           it is a shape rather than a colour. -->
      <div class="pop-sec">
        <div class="t-micro pop-lbl" id="popSrcLbl">Where to search</div>
        <div class="pop-chips" role="group" aria-labelledby="popSrcLbl">
          <button class="pop-chip" type="button" aria-pressed="true" data-src="us">United States</button>
          <button class="pop-chip" type="button" aria-pressed="true" data-src="cn">China</button>
          <button class="pop-chip" type="button" aria-pressed="true" data-src="tw">Taiwan</button>
          <button class="pop-chip" type="button" aria-pressed="true" data-src="ep">Europe</button>
          <button class="pop-chip" type="button" aria-pressed="true" data-src="kr">Korea</button>
          <button class="pop-chip" type="button" aria-pressed="true" data-src="jp">Japan</button>
        </div>
      </div>

      <!-- THE PRODUCT'S OWN WORDS, NOT THE REGISTRY'S. "Issue" and
           "Publication" are what a patent office calls these; brief.md §1 says
           the founder should never have to learn patent vocabulary to get
           value. The coverage table on the home screen already says "granted"
           and "applications", so these are the words the product has already
           taught — and one vocabulary in two places is the whole point. -->
      <div class="pop-sec">
        <div class="t-micro pop-lbl" id="popKindLbl">What to include</div>
        <div class="pop-chips" role="group" aria-labelledby="popKindLbl">
          <button class="pop-chip" type="button" aria-pressed="true" data-kind="granted">Granted patents</button>
          <button class="pop-chip" type="button" aria-pressed="true" data-kind="applications">Applications</button>
        </div>
      </div>

      <!-- §3.8 SITE 3 OF 3, AND 21-surface.css RESERVED IT FOR EXACTLY THIS.
           The selected state of a segmented control is the accent's third and
           last site; the tablist that used to hold it left with the analysis
           surfaces, and the rule was kept warm against this panel arriving.
           One of five is selected, so the accent marks one thing. -->
      <div class="pop-sec">
        <div class="t-micro pop-lbl" id="popCountLbl">How many to bring back</div>
        <div class="seg pop-seg" role="group" aria-labelledby="popCountLbl">
          <button class="seg-btn" type="button" aria-pressed="false" data-count="10">10</button>
          <button class="seg-btn" type="button" aria-pressed="false" data-count="20">20</button>
          <button class="seg-btn" type="button" aria-pressed="true"  data-count="50">50</button>
          <button class="seg-btn" type="button" aria-pressed="false" data-count="100">100</button>
          <button class="seg-btn" type="button" aria-pressed="false" data-count="500">500</button>
        </div>
      </div>

      <!-- YEARS, AND TWO BASES RATHER THAN THREE. The record prints `filed`
           and `published` as years and nothing finer, so a day-level control
           would offer a precision the data does not carry. Priority date is
           the third basis a patent search usually offers and it is left out on
           the same test as "Issue" above: it is a term of art with no meaning
           to the founder and nothing on any surface explains it. -->
      <div class="pop-sec">
        <div class="t-micro pop-lbl" id="popDateLbl">Date range</div>
        <div class="seg pop-seg" role="group" aria-labelledby="popDateLbl">
          <button class="seg-btn" type="button" aria-pressed="true"  data-basis="filed">Filed</button>
          <button class="seg-btn" type="button" aria-pressed="false" data-basis="published">Published</button>
        </div>
        <div class="pop-dates">
          <input class="fld pop-year fig" type="text" inputmode="numeric" maxlength="4"
                 id="popFrom" placeholder="From" aria-label="Earliest year">
          <span class="pop-dash" aria-hidden="true">–</span>
          <input class="fld pop-year fig" type="text" inputmode="numeric" maxlength="4"
                 id="popTo" placeholder="To" aria-label="Latest year">
        </div>
      </div>

      </div>

      <!-- DONE IS NOT PRIMARY, and that is §3.8 rather than restraint: one
           filled button per surface, and this surface's is Search. A filled
           Done twelve pixels from it would put two primary actions on the
           screen and make the smaller one look like the way forward. -->
      <div class="pop-foot">
        <button class="btn btn-ghost pop-reset" id="popReset" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset</span>
        </button>
        <span class="spacer"></span>
        <button class="btn btn-secondary" id="popDone" type="button">Done</button>
      </div>
    </div>

  </div>
