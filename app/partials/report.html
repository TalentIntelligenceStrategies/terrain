<!-- ══ the report · platform.md §5.3 ════════════════════════════════════════
     The starred set read for one question, as paper. Two reports, one shape:
     the Founder report asks "can I build this, and protect it?", the Backer
     report "does this hold up, and who else is here?".

     IT BORROWS THE PAGE SKELETON for its chrome — `.view-page`, `.main`,
     `.page-head`, `.pg-back`, `.foot` — and draws its content as sheets on the
     ground, because a backer reads it beside the memos they already get
     (design-language.md §7, "The report is paper"). The chrome is the app's;
     the sheets are the report's, and only the sheets print.

     THE SHEETS ARE BUILT BY js/surfaces/report.mjs from the starred set and
     the `fieldCounts` port. Nothing here is a value: every number on a sheet
     is counted, and every Pro section is a heading and bars until it runs. -->
  <section class="view view-page view-report" data-view="report" aria-label="Report">
    <main class="main">
      <header class="page-head rep-head">
        <div class="page-head-lines pg-head-lines">
          <button class="pg-back" id="repBack" type="button" data-go="starred">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span>What you starred</span>
          </button>
          <h1 class="t-display-2" id="repTitle" tabindex="-1">Founder report</h1>
        </div>
        <!-- THE SWITCH KEEPS THE SET. Founder and Backer read the same starred
             patents for two different questions, so moving between them is a
             change of question, not of data — the counts are asked for once.
             aria-pressed is written here and kept by report.mjs. -->
        <div class="rep-tools">
          <div class="seg" role="group" aria-label="Which report">
            <button class="seg-btn" type="button" data-rep-kind="founder" aria-pressed="true">Founder</button>
            <button class="seg-btn" type="button" data-rep-kind="backer" aria-pressed="false">Backer</button>
          </div>
          <!-- PRINTS THE PAGE, and that is the whole file test: the PDF is
               this page and nothing more (brief.md §1). Before Pro has run it
               leaves the Pro part out, because a file of empty bars says
               nothing. Secondary, because the one filled button on this
               surface is Run the Pro report. -->
          <button class="btn btn-secondary" id="repPdf" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
            <span>Download PDF</span>
          </button>
        </div>
      </header>

      <!-- §8: an empty set is not a report of bars. It says what fills it and
           offers the act that does. -->
      <div class="rep-empty" id="repEmpty" hidden>
        <p class="empty-note t-body">Nothing starred yet.
          <span class="empty-then">A report reads the patents you star. Star a few on your
            results and come back.</span></p>
      </div>

      <div class="rep-desk" id="repDesk" aria-live="off"></div>

      <p class="foot"><em>Powered by</em><img class="foot-mark foot-mark-light" src="../brand/logos/innovue/Innovue_Logo_Blue_eng_inline.svg" alt="Innovue" width="95" height="13"><img class="foot-mark foot-mark-dark" src="../brand/logos/innovue/Innovue_Logo_Light_eng_inline.svg" alt="Innovue" width="95" height="13"></p>
    </main>
  </section>
