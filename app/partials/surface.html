<!-- THE RESULTS SURFACE · platform.md §4, from the V8 lab (split-v8.html).
     The search panel, then two panels side by side: the results and the
     record. Nothing opens until a result is picked, and the pane says so.
     Below 640px the search docks at the foot of the window and the record
     slides in over the list, full screen. -->
  <section class="view" data-view="work" aria-label="Results">
    <form class="search panel" role="search" id="workSearch" data-composer="work">
      <div class="q">
        <div class="seg" role="group" aria-label="Search by">
          <button type="button" data-mode="text" aria-pressed="true">Text</button><button type="button" data-mode="number" aria-pressed="false">Patent number</button>
        </div>
        <div class="sentence">
          <label><span class="sr-only">Describe what you are building</span>
            <textarea rows="1" maxlength="5000" id="workQuery" placeholder="Describe what you are building"></textarea></label>
        </div>
        <button class="go" type="submit" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="label">Search</span></button>
        <p class="q-note" role="status"></p>
      </div>
      <dl class="scope" aria-label="Searched within">
        <div><dt>Field</dt><dd data-scope="field"></dd></div>
        <div><dt>Offices</dt><dd data-scope="offices"></dd></div>
        <div><dt>Documents</dt><dd data-scope="docs"></dd></div>
        <div><dt>Dates</dt><dd data-scope="dates"></dd></div>
        <div><dt>Results</dt><dd data-scope="n" class="tnum"></dd></div>
        <div class="took" role="status"><dt class="sr-only">Search time</dt><dd id="took"></dd></div>
        <div class="end anchor" data-settings-anchor></div>
      </dl>
    </form>

    <main class="split" id="split" data-closed>
      <section class="list panel" aria-labelledby="listH">
        <div class="list-top">
          <div class="list-head">
            <h2 id="listH">Search results</h2>
            <span class="tip-a">
              <button class="info" type="button" aria-label="About these results" aria-describedby="infoTip"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
              <span class="tip" id="infoTip" role="tooltip"></span>
            </span>
            <div class="tools">
              <div class="seg icons" role="group" aria-label="Results show">
                <button type="button" data-show="details" aria-pressed="true" aria-label="Details and drawings" title="Details and drawings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button>
                <button type="button" data-show="drawings" aria-pressed="false" aria-label="Drawings only" title="Drawings only"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></button>
              </div>
              <div class="anchor">
                <button class="ctl" type="button" id="grpBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="grpPop" aria-label="Group by topic" title="Group by topic">
                  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M3 6v4c0 1.1.9 2 2 2h3"/><path d="M3 10v6c0 1.1.9 2 2 2h3"/></svg><span class="lbl">Group by topic</span>
                  <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
                <div class="pop end menu group-pop" id="grpPop" role="menu" aria-label="Group by topic"></div>
              </div>
              <div class="anchor">
                <button class="ctl" type="button" id="sortBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="sortPop" aria-label="Sort: Relevance">
                  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg><span class="sort-lbl" id="sortLbl">Relevance</span>
                  <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
                <div class="pop end menu" id="sortPop" role="menu" aria-label="Sort the list">
                  <button type="button" role="menuitemradio" data-sort="relevance" aria-checked="true"><svg class="i tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Relevance</button>
                  <button type="button" role="menuitemradio" data-sort="newest" aria-checked="false"><svg class="i tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Newest first</button>
                  <button type="button" role="menuitemradio" data-sort="oldest" aria-checked="false"><svg class="i tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Oldest first</button>
                </div>
              </div>
              <div class="anchor">
                <button class="ctl ctl-icon" type="button" id="expBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="expPop" aria-label="Export these results" title="Export these results">
                  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg></button>
                <div class="pop end menu" id="expPop" role="menu" aria-label="Export these results">
                  <p class="glabel">These results, in this order</p>
                  <button type="button" role="menuitem" data-export-list="csv">Spreadsheet <span class="ext">.csv</span></button>
                  <button type="button" role="menuitem" data-export-list="md">Markdown <span class="ext">.md</span></button>
                </div>
              </div>
            </div>
          </div>
          <div class="filterbar" id="filterbar" hidden></div>
        </div>
        <div class="list-scroll" id="listScroll">
          <div class="rows" id="rows" role="list" tabindex="-1"></div>
        </div>
      </section>
      <section class="pane panel" id="pane" aria-label="Record">
        <div class="empty">
          <span class="glyph"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></span>
          <h2>Select a patent</h2>
          <p>Its full record opens here: the drawings, the claims and every field, as published.</p>
        </div>
        <div class="rec" id="rec"></div>
      </section>
    </main>
  </section>
