<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<!--
  TIS Terrain — browser tab icon. The TIS submark, three polygons, one fill.

  Derived from brand/logos/tis/tis_cubelogo_submark_dark.svg, which is read-only
  and copied from the monorepo; this is a new file rather than an edit to it.
  The geometry is identical, so a diff against the source stays meaningful.

  It carries its own media query because an EXTERNAL favicon cannot inherit
  currentColor from the page that links it — the technique the submark uses
  inside the prototype does not reach here. #252525 is the TIS ink and the
  submark's own fill; #FAFAFA is the text-inverse token. (No double
  hyphen anywhere above: XML forbids one inside a comment, and the token names
  these two values carry would each smuggle one in.)

  One honest limit: this follows the BROWSER's colour scheme, not Terrain's
  in-app theme control. A founder who picks light-in-app on a dark OS gets the
  light-on-dark icon, and nothing an external SVG can do changes that.

  SVG only. CLAUDE.md refuses rasters wholesale — that rule is the guard that
  caught a 6 MB near-miss, and a .ico here would be the thing that removes it.
  The cost is Safari, whose SVG-favicon support is partial: it may show nothing
  rather than falling back.
-->
<style>
  polygon { fill: #252525 }
  @media (prefers-color-scheme: dark) { polygon { fill: #FAFAFA } }
</style>
<polygon points="638.46,455.19 638.64,455.19 776.68,364.9 777.05,364.67 639.63,273.74 502.39,182.97 638.69,92.59 639.05,92.36 501.84,2.62 501.68,2.53 87.46,273.37 87.09,273.63 227.16,365.22 227.32,365.34 364.81,274.18 501.7,364.72 638.36,455.14"/>
