}
/* Each patent in plain English is one block per patent, so it can run onto
   as many pages as it needs without a patent splitting. */
function eachBlocks() {
  return SET.PRO.each.map(e => {
    const r = byRef(e.ref), d = e.drift;
    const drift = d ? `<div class="dr"><div><p class="lbl">${d.label ? d.label[0] : 'The abstract says'}</p><q>${cites(d.a)}</q></div><div><p class="lbl">${d.label ? d.label[1] : 'Claim 1 also requires'}</p><ul>${d.c.map(s => `<li>+ <span>${esc(s)}</span></li>`).join('')}</ul></div></div>` : '';
    return `<div class="ea" data-k="ea${e.ref}"><h4><span class="n">[${e.ref}] ${esc(r.number)}</span> · ${esc(r.holder)} · ${r.versions[0].kind === 'grant' ? 'Granted' : 'Application'}</h4>
      <p>${cites(e.plain)}</p>
      <p><span class="lb">Claim 1</span>${cites(e.claim)}</p>
      <p><span class="lb">Only in dependents</span>${cites(e.deps)}</p>${drift}</div>`;
  });
}

/* SAMPLE TEXT. The shape of a Pro reading — may wording, a citation on every
   sentence — and no claim about any patent or holder. */
const SAMPLE = [
  'Sample text. The closest claims may describe the core of the idea as the description states it <span class="cite">[1][3]</span>. Where the description adds a step the claims do not recite, the idea may differ from them <span class="cite">[2]</span>.',
  'Sample text. A reading here cites the starred patents it rests on, by their row in the appendix, and claims nothing beyond them <span class="cite">[4]</span>.',
  'Sample text. Each line names its basis and the patents behind it <span class="cite">[5][7]</span>.',
  'Sample text. A question the set leaves open, turned toward the team rather than answered for it <span class="cite">[6]</span>.',
];
const MARKS = [['●', 'Present'], ['◐', 'Unclear'], ['○', 'Absent']];

function proBody(kind, m, after) {
  if (!after) {
    if (kind === 'chart') return `<table class="cc"><thead><tr><th scope="col">Feature</th><th>Patent 1</th><th>Patent 2</th><th>Patent 3</th></tr></thead><tbody>${[1, 2, 3, 4].map(i => `<tr><th scope="row">Feature ${i}</th><td>${sk(60)}</td><td>${sk(60)}</td><td>${sk(60)}</td></tr>`).join('')}</tbody></table>`;
    if (kind === 'text') return skp(96) + skp(92) + skp(64);
    return `<ol class="pro-list">${[88, 72, 80].map((w, i) => `<li><span class="n">${i + 1}.</span><span>${sk(w)}</span></li>`).join('')}</ol>`;
  }
  if (kind === 'chart') {
    const refs = m.rows.slice(0, 3);
    return `<table class="cc"><thead><tr><th scope="col">Feature of the idea</th>${refs.map((r, i) => `<th scope="col"><span class="n">[${i + 1}]</span> claim 1</th>`).join('')}</tr></thead><tbody>${[0, 1, 2, 3].map(f => `<tr><th scope="row">Feature ${f + 1} <span class="sub">sample</span></th>${refs.map((_, i) => { const [s, w] = MARKS[(f + i * 2) % 3]; return `<td class="m"><b>${s}</b>${w}</td>`; }).join('')}</tr>`).join('')}</tbody></table>
      <p class="ex-note">Sample marks. Each cites the claim and the passage it rests on; a feature no claim reaches is what falls outside.</p>`;
  }
  if (kind === 'text') return `<p class="pretty">${SAMPLE[0]}</p><p class="pretty">${SAMPLE[1]}</p>`;
  if (kind === 'holders') return `<ol class="pro-list">${m.named.slice(0, 3).map((h, i) => `<li><span class="n">${i + 1}.</span><span><b>${esc(h.name)}</b>, <span class="n">${plural(h.n, 'result', 'results')}</span>. ${SAMPLE[2]}</span></li>`).join('') || `<li><span class="n">1.</span><span>${SAMPLE[2]}</span></li>`}</ol>`;
  if (kind === 'each') return `<ol class="pro-list">${m.rows.slice(0, 3).map((r, i) => `<li><span class="n">[${i + 1}]</span><span><span class="n">${esc(r.number || '')}</span>. ${SAMPLE[1]}</span></li>`).join('')}</ol><p class="ex-note">…one entry for each of the ${m.rows.length} starred patents.</p>`;
  return `<ol class="pro-list">${[0, 2, 3].map((s, i) => `<li><span class="n">${i + 1}.</span><span class="pretty">${SAMPLE[s]}</span></li>`).join('')}</ol>`;
}

/* ══ the three directions ════════════════════════════════════════════════ */
const MARK = s => `<svg class="mk" width="${s}" height="${s}" fill="currentColor" aria-hidden="true"><use href="#tis-mark"/></svg>`;
/* THE LOCKUP: the submark and TIS bold, the product name regular */
const LOCK = s => `${MARK(s)}<span><b>TIS</b> Terrain</span>`;
const figs = m => `${m.figs.slice(0, 4).map(([v, l]) => `<div><dt>${v}</dt><dd>${l}</dd></div>`).join('')}`;

const DIRS = {
  baseline: { note: 'Baseline — Framed Folio’s cover; Ledger’s body, with a hairline frame on every page and the small exhibits that share a base paired; an analysis that opens on a shaded band.',
    part: n => `Part ${n}`, ex: n => `Exhibit ${n}`, labels: ['Before the numbers', 'Appendix', 'Last'],
    order: ['holders', 'years', ['offices', 'classes'], 'cluster', ['status', 'licence']],
    run: () => `<div class="brand">${LOCK(12)}</div><div class="run-r">Patent report · ${D.short}</div>`,
    cover: m => `<div class="cv-band"><div class="cv-top"><span class="brand">${LOCK(22)}</span><span class="d">${D.long}</span></div><div class="grow"></div>
        <p class="cv-kick">Patent report</p><h1 class="cv-q bal">${REPORT.ask}</h1></div>
      <div class="cv-low"><dl class="cv-figs">${figs(m)}</dl>
        <dl class="cv-about"><dt>About</dt><dd class="pretty">${m.about}</dd><dt>Basis</dt><dd class="pretty">${m.basisShort}</dd></dl>
      </div>` },
};

/* ══ the sections ════════════════════════════════════════════════════════
   A section is a list of BLOCKS — an opener, an exhibit, a Pro section, a
   table — and a block never splits across a page. The Pages view packs them
   by measuring (paginate, below), so a page holds as much as fits and the
   PDF breaks where the screen does. */
function sections(m, dir, after, view, div) {
  if (PB) return blockSecs();
  const d = DIRS[dir], out = [];
  const sec = (key, blocks, cls = '', screenOnly = false) => out.push({ key, blocks: blocks.flatMap(b => b.split('<!--split-->')), cls, screenOnly });
  const withPro = after || view === 'screen';
  /* THE ORDER OF THE COUNTS. Ledger pairs the small exhibits that share a
     base — offices with classes, status with licence — so it reads field
     first and starred second; every other direction keeps §5.3's order. */
  /* THE TIS LISTING STAYS OFF PAPER until its data exists, as in app/: on
     screen its exhibit is bars, and a file of bars says nothing */
  const ORDER = SET ? ['holders', 'years', 'timeline', ['offices', 'classes'], 'cluster', view === 'pages' ? 'status' : ['status', 'licence'], 'inventors', 'anomalies', 'lacks'] : d.order || REPORT.counted;
  const q = descGiven() ? m.query : null;
  m = { ...m, about: q ? `“${esc(q)}”` : 'No description given. Part 2 reads the claims alone.', re: q ? `The description: “${esc(q)}”` : 'No description given' };
  if (SET) {
    EXNUM = Object.fromEntries(ORDER.flat().map((k, i) => [k, i + 1]));
    SECNUM = Object.fromEntries(setPro().map(([, , k], i) => [k, `2.${i + 1}`]));
    /* §closest is the closest-claims section whichever form it takes */
    SECNUM.closest = SECNUM.chart || SECNUM.watch;
  }
  const countsSay = SET ? `Every title states a count over the ${m.rows.length} starred patents, and every count can be checked against the appendix.`
    : `Every title states a count. The field is counted over the ${m.c.results} results; status and listing over the ${m.rows.length} starred.`;
  const flat = ORDER.flat();
  let exN = 0;
  const ex = key => {
    const e = exhibit(key, m.c, m.rows); exN++;
    return `<section class="ex" data-k="ex${exN}"><div class="ex-h"><p class="ex-num">${d.ex(exN)}</p><p class="ex-l"><span class="x">${d.ex(exN)} · </span>${e.label}</p></div>
      <h3 class="ex-t bal">${e.title}</h3>
      <div class="ex-b">${e.body}</div>${e.note ? `<p class="ex-note pretty">${e.note}</p>` : ''}
      <p class="ex-src">Source: TIS Terrain, ${D.short}. Base: ${e.base}.</p></section>`;
  };
  const tags = '<span class="tag">Pro</span>';
  const op = (n, t, s) => div ? '' : `<header class="op"><p class="op-n">${n}</p><h2 class="op-t bal">${t}</h2>${s ? `<p class="op-s pretty">${s}</p>` : ''}</header>`;
  /* the front matter is numbered too where the margin numbers it */
  const fm = (n, s) => /^\d+$/.test(n) ? `${n} · ${s}` : s;
  const toc = [[fm(d.labels[0], 'How the set was made'), 'made'], [fm(d.sum || '', 'At a glance'), 'glance'], [`${d.part(1)} · The counts`, 'counts'],
    ...(withPro ? [[`${d.part(2)} · Analysis`, 'pro'], ...(SET ? setPro().map(([t], i) => [`<span class="n">2.${i + 1}</span> ${t}`, `ps${i}`, true]) : [])] : []),
    ['Appendix · The starred patents', 'apx'], ['What this report is not', 'close']];
  const tocList = `<ol class="toc">${toc.map(([t, k, sub]) => `<li${sub ? ' class="sub"' : ''}><span>${t}</span><span class="dots"></span><span class="n" ${sub ? 'data-at' : 'data-first'}="${k}"></span></li>`).join('')}</ol>`;
  m = { ...m, toc, tocList };

  /* A PART DIVIDER: the part's numeral and title, and what is in it with the
     page each item lands on. It is the part's opener, so the inline opener
     goes when dividers are on. */
  const divider = (key, n, t, s, items, screenOnly = false) => {
    if (!div) return;
    sec(key, [`<div class="grow"></div><div class="dv"><p class="dv-n">${n}</p><h2 class="dv-t bal">${t}</h2>${s ? `<p class="dv-s pretty">${s}</p>` : ''}
      <ol class="toc dv-toc">${items.map(([it, k]) => `<li><span>${it}</span><span class="dots"></span><span class="n" data-at="${k}"></span></li>`).join('')}</ol></div><div class="grow" style="flex-grow:.4"></div>`], 'pg-div', screenOnly);
  };

  sec('cover', [d.cover(m)], 'pg-cover');

  const leadBody = after && SET ? `<ol class="bl">${concOf().map((c, i) => `<li><span class="n">${i + 1}</span><span><b>${esc(c.head)}</b> ${say(c.short)} <span class="refs">→ ${SECNUM.conclusion}</span></span></li>`).join('')}</ol>`
    : after ? `<p class="pretty">${SAMPLE[0]} ${SAMPLE[1]}</p>` : `${skp(96)}${skp(90)}${skp(58)}<p class="ex-note">${REPORT.lead[1]} Written when you run the Pro report.</p>`;
  const lead = `<section class="lead${after ? '' : ' only-screen'}"><h3>${REPORT.lead[0]} ${tags}</h3>${leadBody}</section>`;
  sec('made', [
    `${div ? `<header class="op"><p class="op-n">${d.labels[0]}</p><h2 class="op-t bal">How the set was made</h2><p class="op-s pretty">Every count in this report rests on what follows.</p></header>` : op(d.labels[0], 'How the set was made', 'Every count in this report rests on what follows.')}
     <dl class="memo"><dt>Re</dt><dd>${m.re}</dd><dt>Date</dt><dd>${D.long}</dd><dt>Basis</dt><dd class="pretty">${m.basis}</dd></dl>`,
    `<div class="m-body m-one"><div class="m-main"><p class="lbl">Contents</p>${tocList}</div></div>`]);

  /* AT A GLANCE: the key figures, the bottom line, and every counted exhibit
     small, each with the page its full version is on. A view of the set, so
     it is admissible before Part 1; the bottom line is Pro and marked. */
  {
    /* a hand-written set's bottom line is four answers, so the glance keeps the
       three tiles a backer reads first and stays one page */
    const tiles = (SET ? ['holders', 'status', 'years'] : ['holders', 'status', 'years', 'offices', 'classes', 'licence']).map(key => {
      const e = exhibit(key, m.c, m.rows), n = flat.indexOf(key) + 1;
      const body = key === 'holders' ? hbars(holderRows(m.c).rows.map(r => [r.label, r.n, r.dim])) : e.body;
      return `<div class="gl-t"><p class="gl-l">${e.label}</p><p class="gl-h pretty">${e.title}</p><div class="gl-b">${body}</div><p class="gl-p">Exhibit ${n} · page <span class="n" data-at="ex${n}"></span></p></div>`;
    }).join('');
    sec('glance', [`${div ? '' : `<header class="op"><p class="op-n">${d.sum || 'Summary'}</p><h2 class="op-t">At a glance</h2></header>`}
      <dl class="gl-figs">${m.figs.slice(0, 5).map(([v, l]) => `<div><dt>${v}</dt><dd>${l}</dd></div>`).join('')}</dl>${lead}`,
      `<div class="gl-grid">${tiles}</div>`], 'pg-glance');
  }

  divider('counts', d.part(1), 'The counts', countsSay,
    flat.map((k, i) => [exhibit(k, m.c, m.rows).label, `ex${i + 1}`]));
  const blocks = ORDER.map(o => Array.isArray(o) ? `<div class="pair">${o.map(ex).join('')}</div>` : ex(o));
  blocks[0] = `${op(d.part(1), 'The counts', countsSay)}${blocks[0]}`;
  /* THE TURN. Part 1 ends on what its counts cannot say, which is the
     question Part 2 opens by answering. */
  /* After Pro it is a bridge; in a file made before Pro it states the copy's
     scope and sells nothing, because that file is forwarded; on screen before
     Pro it is not here at all — it heads the Pro band instead. */
  if (SET && after) blocks.push(`${blocks.pop()}<p class="turn">The counts say who holds these patents, when they were filed and what the records leave out. They cannot say how close any claim comes to the idea.<span>That is a reading, and Part 2 is where the report makes one.</span></p>`);
  else if (SET && view === 'pages') blocks.push(`${blocks.pop()}<p class="turn">This copy carries the counts only.<span>It does not say how close any claim comes to the idea.</span></p>`);
  sec('counts', blocks);

  const band = SET && !after ? `<div class="band band-turn"><div><p class="bt">The counts say who holds these and when. They can’t say how close any claim comes to ${descGiven() ? 'your idea' : 'your product'}.</p><p class="pretty">${descGiven() ? 'Pro reads each claim against your features, and cites every patent it rests on.' : 'Pro reads each claim and says what a product would need to do to come near it.'} Ready in about 10 minutes. Paid per report.</p></div><button type="button" class="run-btn only-screen">Run the Pro report</button></div>` : `<div class="band"><div><h2>${d.part(2)} · Analysis</h2><p class="pretty">${after ? 'Generated from the starred patents and the description. Every reading cites the patents it rests on, by their row in the appendix.' + (SET ? ' Everything in Part 2 is a reading of the claims. A sentence marked <span class="st st-C">C</span> can be checked against the rows; one marked <span class="st st-O">O</span> comes from outside the records.' : '') : 'Generated from the starred patents and the description. Ready in about 10 minutes. Paid per report.'}</p></div>${after ? '' : '<button type="button" class="run-btn only-screen">Run the Pro report</button>'}</div>`;
  const PRO = SET ? setPro() : REPORT.pro;
  const body = k => SET && after ? setBody(k) : proBody(k, m, after);
  const hn = (t, i) => SET ? `<span class="n hn">2.${i + 1}</span>${t}` : t;
  const ps = ([t, w, k], i) => `<section class="ps" data-k="ps${i}"><h3>${hn(t, i)} ${tags}</h3><p class="ps-q pretty">${w}</p><div class="ps-b">${body(k)}</div></section>`;
  /* THE PRO INPUT. Before it runs, the band carries the idea's features as
     the founder wrote them; they become the claim chart's rows. */
  const feat = SET && !after && descGiven() ? `<div class="feat"><p class="lbl">The idea’s features · Pro reads each one against the closest claims</p><ol>${SET.FEATURES.map((f, i) => `<li><span class="n">${i + 1}.</span><span>${esc(f)}</span></li>`).join('')}</ol><p>Taken from the description; edit or add before you run. Each becomes a row of the claim chart.</p></div>` : '';
  divider('pro', d.part(2), 'Analysis', 'Generated from the starred patents and the description. Every reading cites the patents it rests on.', PRO.map(([t], i) => [t, `ps${i}`]), !after);
  const blocksOf = ([t, w, k], i) => SET && after && k === 'each'
    ? (([first, ...rest]) => [`<section class="ps" data-k="ps${i}"><h3>${hn(t, i)} ${tags}</h3><p class="ps-q pretty">${w}</p><div class="ps-b">${first}</div></section>`, ...rest.map(b => `<div class="ps-b ps-cont">${b}</div>`)])(eachBlocks())
    : SET && after ? ((h) => { const [a, ...b] = h.split('<!--split-->'); return [ps([t, w, k], i).replace(h, a), ...b.map(x => `<div class="ps-b ps-cont">${x}</div>`)]; })(setBody(k)) : [ps([t, w, k], i)];
  const head = `${op(d.proLabel || d.part(2), 'Analysis', 'A reading of the starred patents against the description, a section to a page.')}${band}${feat}`;
  const disc = `<p class="disc pretty">${REPORT.disclaimer}</p>`;
  if (SET) {
    /* A PAGE PER SECTION: each Pro section starts a sheet of its own, so a
       backer can pull one out; the opener and band ride with the first, and
       the disclaimer closes the last. */
    const S = PRO.map(blocksOf);
    S[S.length - 1].push(`${S[S.length - 1].pop()}${disc}`);
    /* PART 2 OPENS ON A SHEET OF ITS OWN: the opener, the band (the run
       before Pro; the tag key after) and what the part holds, with pages */
    const list = `<p class="lbl">In this part</p><ol class="toc">${PRO.map(([t], i) => `<li><span><span class="n hn">2.${i + 1}</span> ${t}</span><span class="dots"></span><span class="n" data-at="ps${i}"></span></li>`).join('')}</ol>`;
    sec('pro', [`${head}${!after && descGiven() ? '' : list}`], 'pg-pro1', !after);
    S.forEach((bl, i) => sec(`pro${i}`, bl, 'pg-pro1', !after));
  } else {
    const P = PRO.flatMap(blocksOf), last = P.pop();
    P[0] = `${head}${P[0]}`;
    /* the disclaimer closes the Pro part, so it travels with the last section
       rather than landing alone on a page of its own */
    sec('pro', [...P, `${last}${disc}`], 'pg-pro1', !after);
  }

  divider('apx', d.labels[1], 'The starred patents', `${plural(m.rows.length, 'patent', 'patents')}, ${m.s.grant} granted, and what this report is not.`,
    [['The starred patents', 'apx-t'], ['What this report is not', 'close-t']]);
  sec('apx', [`${op(d.labels[1], 'The starred patents', `${plural(m.rows.length, 'patent', 'patents')}, ${m.s.grant} granted. A reading cites each by its row.${SET ? ' Nominal 20 yr is the filing year plus twenty, for grants only — not an expiry date, since priority, term adjustment and fees are not in the records.' : ''}`)}
    ${SET ? (() => {
      /* ONE TABLE PER ROW, sharing a colgroup, so a long set breaks at the
         row that no longer fits and still reads as one table */
      const cols = '<colgroup><col style="width:4%"><col style="width:40%"><col style="width:19%"><col style="width:6%"><col style="width:12%"><col style="width:12%"><col style="width:7%"></colgroup>';
      const head = '<thead><tr><th scope="col">Ref.</th><th scope="col">Patent</th><th scope="col">Holder, as recorded</th><th scope="col">Office</th><th scope="col">Filed</th><th scope="col">Status</th><th scope="col">Nominal 20 yr</th></tr></thead>';
      const tr = r => `<tr><td class="n">${r.ref}</td><td><span class="n pn">${esc(r.number)}</span><span class="ttl">${esc(r.title)}</span></td><td><span class="ttl">${esc(r.recorded)}</span></td><td class="n">${esc(r.where)}</td><td class="n">${r.filed}</td><td>${r.versions[0].kind === 'grant' ? 'Granted' : 'Application'}</td><td class="n">${r.nominal ?? '—'}</td></tr>`;
      const last = m.rows.length - 1;
      return m.rows.map((r, i) => `${i ? '<!--split-->' : ''}<table class="apx apx-f"${i ? '' : ' data-k="apx-t"'}>${cols}${i ? '' : head}<tbody>${tr(r)}</tbody></table>${i === last ? `<p class="ex-src">Source: TIS Terrain, ${D.short}. Base: ${m.rows.length} starred.</p>` : ''}`).join('');
    })() : `<div class="apx-w" data-k="apx-t"><table class="apx"><thead><tr><th scope="col">Ref.</th><th scope="col">Number</th><th scope="col">Holder</th><th scope="col">Office</th><th scope="col">Filed</th><th scope="col">Status</th><th scope="col">TIS listing</th></tr></thead><tbody>${m.rows.map((r, i) => {
      const k = r.versions?.[0]?.kind, filed = r.filed ? String(r.filed).slice(0, 4) : (r.year ?? '—');
      return `<tr><td class="n">${i + 1}</td><td class="n">${r.number ? esc(r.number) : sk(80)}</td><td>${r.holder == null ? sk(70) : `<span class="hold">${esc(holderText(r.holder))}</span>`}</td><td class="n">${r.where ? esc(codeOf(r.where) || r.where) : '—'}</td><td class="n">${filed}</td><td>${k === 'grant' ? 'Granted' : k === 'application' ? 'Application' : '—'}</td><td>${sk(50)}</td></tr>`;
    }).join('')}</tbody></table>
    <p class="ex-src">Source: TIS Terrain, ${D.short}. Base: ${m.rows.length} starred.</p></div>`}`]);

  sec('close', [
    `${div ? `<header class="op"><p class="op-n">${d.labels[2]}</p><h2 class="op-t bal">What this report is not</h2></header>` : op(d.labels[2], 'What this report is not')}
    <ol class="cl-list" data-k="close-t">
      <li><h3>It is not advice.</h3><p class="pretty">Nothing here is legal or investment advice.</p></li>
      <li><h3>It is not an opinion on any patent.</h3><p class="pretty">It is not a freedom-to-operate, patentability or validity opinion, and no word in it says a patent is infringed, clear or novel.</p></li>
      <li><h3>It is not a full search.</h3><p class="pretty">${SET ? `Its counts and its readings rest on the ${plural(m.rows.length, 'patent', 'patents')} starred from one search, whose full results are not part of this copy.` : `Its counts describe what ${plural(m.searches.length, 'search', 'searches')} returned — ${plural(m.c.results, 'result', 'results')} — and its readings rest on the ${plural(m.rows.length, 'patent', 'patents')} starred from them.`} Patents outside this set may matter.</p></li>
      <li><h3>It holds no score.</h3><p class="pretty">No number in it is a rating, a rank or a probability. Every count can be checked against the rows it was taken from.</p></li>
      <li><h3>Its readings are marked.</h3><p class="pretty">Part 2 is generated from the starred patents and the description, marked Pro, and every reading cites the patents it rests on.${after ? '' : ' It has not been run for this copy, so this copy carries none.'}${SET && after ? ` All of it is a reading of the claims unless marked: <span class="st st-C">C</span> checkable against the rows, <span class="st st-O">O</span> a fact from outside the records, to verify before relying on it.` : ''}</p></li>
    </ol>`,
    `<div class="cl-made"><p class="lbl">How this report was made</p>
      <dl class="memo"><dt>Generated</dt><dd>By TIS Terrain on ${D.long}, from a starred set.</dd><dt>Searches</dt><dd>${m.searches.map(s => `“${esc(s.query)}”`).join('; ')}</dd><dt>Basis</dt><dd class="pretty">${m.basis}</dd></dl></div>`], 'pg-close');

  /* THE BENCH SHEET: what the two reads found that the report leaves out,
     and why. On screen only — it is a note to whoever is cutting, not paper. */
  if (SET && SET.BENCH) sec('bench', [`<header class="op"><p class="op-n">Bench · not in the report</p><h2 class="op-t">In the reads, out of the report</h2><p class="op-s pretty">Screen only. Never printed.</p></header>
    <ol class="cl-list">${SET.BENCH.map(([t, s, w]) => `<li><h3>${esc(t)}</h3><p class="pretty">${cites(s)}</p><p class="pretty"><b>Why out:</b> ${esc(w)}</p></li>`).join('')}</ol>`], 'pg-bench', true);

  return out.filter(s => view === 'screen' || !s.screenOnly);
}

const foot = (no, of) => `<span class="ft-l">Patent report · ${D.short}</span><span class="pgno">Page <span class="n">${no}</span> of <span class="n">${of}</span></span>`;

/* ══ pagination ══════════════════════════════════════════════════════════
   Each section starts a page. A block goes onto the current page; if the page
   now holds more than it shows and the block was not alone on it, the block
   comes off and starts the next one. Screen view does not paginate: one
   sheet per section, as tall as it needs. */
function paginate(secs, view, d) {
  const desk = document.getElementById('desk'), pages = [];
  desk.innerHTML = '';
  const fresh = (s, cont) => {
    const el = document.createElement('section'), cover = s.key === 'cover';
    el.className = `pg ${cont ? '' : s.cls}`.trim();
    /* the head and foot are filled now, with placeholder numbers, because
       the room a page has is what is left after them */
    el.innerHTML = `${cover ? '' : `<div class="run">${d.run(1, 1)}</div>`}<div class="pg-in"></div>${cover ? '' : `<div class="ft">${foot(1, 1)}</div>`}`;
    desk.append(el); pages.push({ el, key: s.key, cover });
    return el.querySelector('.pg-in');
  };
  for (const s of secs) {
    let inn = fresh(s, false), n = 0;
    for (const b of s.blocks) {
      const before = inn.childNodes.length;
      inn.insertAdjacentHTML('beforeend', b);
      if (view === 'pages' && n > 0 && inn.scrollHeight > inn.clientHeight + 1) {
        [...inn.childNodes].slice(before).forEach(x => x.remove());
        inn = fresh(s, true);
        inn.insertAdjacentHTML('beforeend', b);
      }
      n++;
    }
  }
  /* A CONTINUED BLOCK NEVER OPENS A PAGE WITH A RULE: whatever lands first
     on a sheet drops the top rule and the space that separated it */
  for (const p of pages) p.el.querySelector('.pg-in')?.firstElementChild?.classList.add('at-top');
  return pages;
}

async function paint(m) {
  const r = document.documentElement, dir = r.dataset.dir, view = r.dataset.view, after = r.dataset.pro === 'after', div = r.dataset.div === 'on';
  const d = DIRS[dir];
  document.getElementById('dirNote').textContent = d.note;
  for (const [id, key] of [['segDir', 'dir'], ['segView', 'view'], ['segPro', 'pro'], ['segDiv', 'div'], ['segDesc', 'desc']])
    for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === r.dataset[key]));
  fit();
  /* twice: a typeface the direction has not used yet loads only once text
     asks for it, and a page measured in the fallback packs wrong */
  const secs = sections(m, dir, after, view, div);
  paginate(secs, view, d);
  await document.fonts.ready;
  const pages = paginate(secs, view, d);
  const of = pages.length, firstOf = {};
  pages.forEach((p, i) => {
    if (!(p.key in firstOf)) firstOf[p.key] = i + 1;
    if (p.cover) return;
    p.el.setAttribute('aria-label', `Page ${i + 1}`);
    p.el.querySelector('.run').innerHTML = d.run(i + 1, of);
    p.el.querySelector('.ft').innerHTML = foot(i + 1, of);
  });
  for (const el of document.querySelectorAll('[data-first]')) el.textContent = firstOf[el.dataset.first] || '';
  /* an item's page, for the dividers and the glance tiles */
  const at = {};
  pages.forEach((p, i) => { for (const k of p.el.querySelectorAll('[data-k]')) if (!(k.dataset.k in at)) at[k.dataset.k] = i + 1; });
  for (const el of document.querySelectorAll('[data-at]')) el.textContent = at[el.dataset.at] || '';
  if (view === 'pages' && !after) document.getElementById('desk').insertAdjacentHTML('afterbegin', '<p class="desk-say">Before Pro, the PDF leaves Part 2 out. Switch to Screen to see it, or to After to see it filled.</p>');
  check();
}

/* OVERFLOW IS A BUG ON PAPER: a fixed sheet that holds more than it shows
   prints the cut. Every page is measured and an overflowing one outlined. */
function check() {
  let n = 0;
  for (const p of document.querySelectorAll('.pg')) {
    const inn = p.querySelector('.pg-in');
    const over = document.documentElement.dataset.view === 'pages' && inn.scrollHeight > inn.clientHeight + 1;
    p.toggleAttribute('data-over', over); if (over) n++;
  }
  const o = document.getElementById('over');
  o.dataset.n = n; o.textContent = document.documentElement.dataset.view === 'pages' ? (n ? `${n} page${n > 1 ? 's' : ''} overflow` : 'All pages fit') : '';
  document.documentElement.dataset.ready = '1';
}
function fit() {
  const z = Math.min(1, (innerWidth - 32) / 816);
  document.documentElement.style.setProperty('--zoom', String(z));
}
addEventListener('resize', fit);
addEventListener('beforeprint', () => document.documentElement.style.setProperty('--zoom', '1'));
addEventListener('afterprint', fit);

let kind, query, searches, rows, fc;
if (SET) {
  /* a hand-written set: its rows are the starred set, counted in the client
     exactly as the report counts starred rows (tallyField) */
  kind = 'set'; query = SET.QUERY; rows = SET.ROWS;
  searches = [{ query: SET.SEARCH, field: null, settings: {}, mode: 'text' }];
  fc = { ok: true, data: tallyField(rows) };
  document.getElementById('gDesc').hidden = false;
} else {
  let E; [kind, E] = await engine();
  query = IDEA[kind];
  searches = [{ query, field: null, settings: { count: 40 }, mode: 'text' }];
  const res = await E.search({ query, settings: { count: 40 }, mode: 'text' });
  rows = (res.ok ? res.data.patents : []).slice(0, STARS);
  fc = await E.fieldCounts({ searches });
}
if (!fc.ok || !rows.length) {
  document.getElementById('desk').innerHTML = '<p class="desk-say">The counts did not load.</p>';
} else {
  const c = fc.data, s = statusOf(rows), h = holderRows(c);
  const offices = c.offices.filter(([w]) => w).length;
  const top3 = h.top.reduce((a, x) => a + x.n, 0);
  const model = {
    kind, query, searches, rows, c, s, offices, named: h.named,
    basis: SET ? `${esc(SET.BASIS)} Counts describe the starred patents, not every patent that exists.`
      : `${plural(searches.length, 'search', 'searches')}, ${plural(c.results, 'result', 'results')}; ${plural(rows.length, 'patent', 'patents')} starred. Counts describe what the searches returned, not every patent that exists.`,
    basisShort: SET ? `One search, “${esc(SET.SEARCH)}”; ${plural(rows.length, 'patent', 'patents')} starred.`
      : `${plural(searches.length, 'search', 'searches')}, ${plural(c.results, 'result', 'results')}, ${plural(rows.length, 'patent', 'patents')} starred.`,
    figs: SET ? [
      [rows.length, 'patents starred'],
      [`${s.grant} / ${rows.length}`, 'granted'],
      [offices, offices === 1 ? 'office' : 'offices'],
      [h.named.length, 'holders'],
      [top3, `held by the top ${h.top.length} holders`],
    ] : [
      [c.results, `results from ${plural(searches.length, 'search', 'searches')}`],
      [rows.length, 'patents starred'],
      [`${s.grant} / ${rows.length}`, 'starred patents granted'],
      [offices, offices === 1 ? 'office' : 'offices'],
      ...(top3 ? [[top3, `results held by the top ${h.top.length} holders`]] : []),
    ],
  };
  paint(model);
  const set = (key, v) => {
    document.documentElement.dataset[key] = v;
    const u = new URL(location.href); u.searchParams.set(key, v); history.replaceState(null, '', u);
    paint(model);
  };
  for (const [id, key] of [['segDir', 'dir'], ['segView', 'view'], ['segPro', 'pro'], ['segDiv', 'div'], ['segDesc', 'desc']])
    document.getElementById(id).addEventListener('click', e => { const b = e.target.closest('button'); if (b) set(key, b.dataset.v); });
  document.getElementById('print').addEventListener('click', () => {
    if (document.documentElement.dataset.view !== 'pages') set('view', 'pages');
    window.print();
  });
}
</script>
</body>
