<!-- ═══════════════════════════════════════════════════════════════════════
     TERRAIN — THE REPORT LAB. A bench, not a product surface.

     ONE REPORT, ONE BASELINE, TWO SOURCES. The patent report (platform.md
     §5.3) in the brand — Urbanist, Inconsolata, the ink pair, no hue. The
     cover is Framed Folio's: an ink band flush inside a double hairline
     frame. The body is Ledger's: a hairline frame on every page, a summary
     page, the small exhibits that share a base paired. The analysis opens on
     a shaded band with a left rule. Dividers (?div=on) are an option.
     No Innovue mark: a report is a document, not a product surface (brief §3).

     THE CONTENT IS COMPUTED, NOT TYPED. The bench runs one search through
     the same engine seam app/js/main.mjs uses — corpus/ when it is on disk,
     demo/ otherwise or under ?data=demo — stars the first twelve, and counts
     the field through `fieldCounts`. No holder name is in this file; one
     appears only when corpus/ is served beside it.

     THE PRO TEXT IS A PLACEHOLDER, AND SAYS SO. Pro does not run in the
     reference. "After Pro" shows the shape of a reading — may wording, every
     sentence citing the appendix rows it rests on — labelled Sample text, and
     claims nothing about any patent or holder.

     PAGES IS THE PDF. Every page is a US Letter sheet, 816 × 1056 at 96dpi,
     with its running head and foot inside it rather than in @page margin
     boxes, so the screen and the file paginate identically. Before Pro, the
     Pages view and the PDF leave Part 2 out (platform.md §5.3).

     Needs a server, like app/: python3 -m http.server 8765 from the repo
     root, then /design/previews/terrain-report-lab.html
     ?dir=baseline
     ?view=screen|pages  ?pro=before|after  ?div=on|off

     A HAND-WRITTEN SET. ?set=<name> reads corpus/<name>/report.mjs instead
     of searching: its rows, its Part 1 additions (a filing timeline, record
     anomalies, inventors, what the set does not contain) and Part 2 written
     by hand from the records, every sentence tagged checkable, reading or
     outside the record. corpus/ is local, so this file still names no
     holder; without the module the bench falls back to the search above.
     ?desc=given|none shows Part 2 with and without a description.
     ═══════════════════════════════════════════════════════════════════════ -->

<script>
/* Before first paint: the direction, view and Pro state come from the URL so
   a headless print lands on the right one without a click. Paper does not
   swap, so the bench is light whatever the system says. */
(function(){
  var q = new URLSearchParams(location.search), r = document.documentElement;
  var d = q.get('dir'), v = q.get('view'), p = q.get('pro');
  if (/^(baseline)$/.test(d)) r.setAttribute('data-dir', d);
  if (/^(screen|pages)$/.test(v)) r.setAttribute('data-view', v);
  if (/^(before|after)$/.test(p)) r.setAttribute('data-pro', p);
  if (/^(on|off)$/.test(q.get('div'))) r.setAttribute('data-div', q.get('div'));
  r.setAttribute('data-desc', q.get('desc') === 'none' ? 'none' : 'given');
})();
</script>

     1 primitive  11   no component may read one
     2 scale      28   invariant by construction
     3 semantic   27   declared in all three blocks — this is the dark contract
     4 derived     1   resolves THROUGH a themed token. Never in a dark block
     5 component   —   not here at all. On the component's own class,
                       design-language.md §3.9

   ══════════════════════════════════════════════════════════════════════════ */

/* both schemes declared, so the scrollbars, form controls and the canvas
   behind the page follow the theme. [data-theme] pins it once the founder
   has chosen — the attribute is what the toggle writes. */
html{color-scheme:light dark;background:var(--ground)}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

/* ── 1 · PRIMITIVE ─────────────────────────────────────────────────────────
   NO COMPONENT MAY READ ONE. A component that reads --n-* is a component that
   stays light and throws nothing, logs nothing, and reads as correct CSS.
   design-language.md §3.2; check-app.py gate A refuses it. */
:root{
  /* neutral ramp — even in L*, true neutral (R = G = B)

     --n-7 IS MEASURED AGAINST --surface-sunken AND NOT SPACED WITH THE REST.
     It has exactly one consumer, --text-3, and --text-3's hardest ground is
     not --surface but --n-3, the sunken fill that .seg, .hf, .set-row[data-open]
     and .set-thumb-more all use. At #6F6F6F that pair measured 4.41:1 against
     the 4.5 owed to text under 18.66px — failing on the theme switch's own
     labels, the record's eleven field labels, the open row's rank and the
     drawing strip's MORE. Two steps darker clears it at 4.54:1 and costs
     nothing anywhere else: on --surface it moves 5.02 -> 5.17. Dark's
     --text-3 is a separate value and already measured 5.81 on its own sunken,
     so it does not move. */
  --n-0:#FFFFFF; --n-1:#FCFCFC; --n-2:#F6F6F6; --n-3:#F0F0F0;
  --n-4:#E4E4E4; --n-5:#D1D1D1; --n-6:#B0B0B0; --n-7:#6D6D6D;
  --n-8:#595959; --n-9:#383838; --n-10:#252525;
}

/* ── 2 · SCALE ─────────────────────────────────────────────────────────────
   Invariant by construction: a step, a radius and a duration are the same in
   both themes, and a dark block that redefined one would be saying the
   interface is a different size at night. */
:root{
  --s-2:2px; --s-4:4px; --s-6:6px; --s-8:8px; --s-10:10px; --s-12:12px;
  --s-14:14px; --s-16:16px; --s-20:20px; --s-24:24px; --s-32:32px;
  --s-40:40px; --s-56:56px; --s-72:72px;
  --r-chip:4px; --r-seg:6px; --r-control:8px; --r-inner:12px;
  --r-widget:16px; --r-shell:20px; --r-pill:999px;
  /* two curves. --ease for anything the founder initiated; --ease-in-out for
     system-driven movement only, because it is flat at the start. Constant
     motion is linear. design-language.md §6.                                  */
  --ease:cubic-bezier(.2,0,0,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --dur-1:120ms; --dur-2:200ms; --dur-3:320ms; --dur-4:520ms;
  /* --dur-4 and --ease-in-out have no reader today. Both stay: the ladder
     is invariant by construction, and a curve is part of a named vocabulary
     rather than a rung. --ease-drawer went, because it was named for the
     slide-over and the slide-over is retired -- a curve named for a dead
     component is dead with it. */
  --cycle:1.6s;                     /* one indicator cycle for the whole page */
}

/* ── 3 · SEMANTIC · light ──────────────────────────────────────────────────
   COMPONENTS READ ONLY THESE. The next three blocks carry THE SAME NAMES IN
   THE SAME ORDER, and check-app.py gate D refuses any drift between them.

   THE COUNT IS NOT REPEATED HERE. This read "the same 28 names" while the
   tier table eleven lines up read 32 and the file held 32 -- a tally nothing
   checks, gone stale exactly the way the ramp comment above says they do.
   Gate D asserts the PROPERTY, and gate G is what holds the number, in the
   one place it is argued.                                                  */
:root{
  --ground:var(--n-2); --surface:var(--n-0); --surface-sunken:var(--n-3);
  --border:var(--n-4); --border-strong:var(--n-5);
  /* THE ACCENT · brief.md §5, design-language.md §3.8.
     Terrain's accent is ACHROMATIC. It is the near-black ink pair, and that is
     the decision rather than a slot waiting on a hue.

     WHY THERE IS NO COLOUR HERE. §2 permits colour where it carries
     information and nowhere else, and a control's colour carries none: it
     says "press here", which its shape and its word already say. A chromatic
     accent would also be the one hue in a product that has no other, so it
     would read as data. The cost is worth naming: a near-black primary action
     is calmer and less inviting than a coloured one.

     THE FOUR TOKENS STAY, BECAUSE THE ACCENT IS A ROLE AND NOT A HUE.
     All four hold ink values today, and that is not a reason to fold them into
     --text-1. §3.8's three permitted sites have to be able to SAY they are the
     accent; a site that read --text-1 would leave §3.8 pointing at nothing,
     and the rule would stop being enforceable the moment somebody added a
     fourth site. The VALUE is settled. The ROLE still needs a name.

     THERE ARE FOUR, AND THE FOURTH IS THE ACCENT AS A FOREGROUND.
     --accent is a FILL, --accent-ink is what sits ON that fill. Two of §3.8's
     three sites do not want a fill: the selected technology tile keeps
     --surface because "a filled accent tile here would be a second primary
     action on a surface that already has Search" (38-home.css), and the
     settings panel's segmented control is a pill on a track. Both point the
     FILL token at `color`, which is a foreground job, so the foreground gets
     its own token rather than a second job for --accent.

     AND --accent-hover IS THE THIRD, NOT A SPARE. --ink-hover is a NEUTRAL:
     one step along the neutral ramp, which is the correct hover for a
     near-black fill. It and --accent-hover agree today and are still two
     tokens, because one answers "how does an ink fill hover" and the other
     answers "how does the accent hover", and those stay two questions. */
  --accent:var(--n-10); --accent-ink:#FAFAFA; --accent-hover:var(--n-9);
  --accent-on-surface:var(--n-10);   /* the accent as INK, on --surface */
  --text-1:var(--n-10); --text-2:var(--n-8); --text-3:var(--n-7);
  --text-disabled:var(--n-6); --text-inverse:#FAFAFA;
  /* three more semantics, added with the dark pass. Each replaced a component
     that was reaching past --n-* into the ramp: §10 makes dark cheap only if
     no component reads a primitive, and eleven of them did. */
  --ink-hover:var(--n-9);        /* hover on an ink fill — the only ink state */
  --track-pressed:var(--n-4);    /* a bar track under the selected row */


  /* THE CHART LAYER, SINGULAR — narrowed 2026-09-23. There were three, for a
     dashboard of twelve widgets that no longer exists. --chart-trend and
     --chart-unknown went with the filings chart; this one stayed because the
     points page still draws a column per day, and a column is still a chart.

     §3.5 narrows with it rather than being deleted: one series, no trend line,
     no unpublished-window band. A second layer here means a second question is
     being asked on one chart, and the destinations do not ask one. */

  --skeleton:var(--n-4); --skeleton-shimmer:var(--n-3); --skeleton-strong:var(--n-5);

  /* --veil is the translucent ground under a control bar FLOATING OVER
     CONTENT — the figure viewer's zoom/rotate bar, sitting on a patent's own
     line-work. Alpha because what is behind it is
     the drawing and varies pixel to pixel, so a flat neutral would either
     hide the drawing or fail to separate the buttons from it.

     .82 IS MEASURED, not chosen for feel. Below about .78 the 1.5px Lucide
     strokes stop clearing 4.5:1 against the black line-work that shows through;
     above .90 the bar stops reading as floating and becomes a solid plate over
     the figure. It is paired with a 1px --border, because §5 is explicit that a
     shadow cannot separate two surfaces of the same colour and this one sits on
     white. */
  --veil:rgba(255,255,255,.82);
  /* --veil-edge IS --veil's OWN ARGUMENT, APPLIED TO THE EDGE. The note above
     says a translucent surface "composites over something whose colour varies
     and cannot be a flat neutral". The BORDER on that same surface composites
     over the same varying thing and was a flat neutral -- --border, which
     SWAPS. So in dark the figure bar wore a #2E2E2E hairline measuring 13.6:1
     against the #FFFFFF pill it edges, where light's #E4E4E4 measures 1.27:1.
     A factor of ten for one declaration. The reasoning had been applied to the
     fill and not to the edge; this is the other half of it.

     .12 IS MEASURED TWICE, ONCE PER BACKDROP.
     - Over WHITE paper the pill composites to #FFFFFF and this edge to
       #E5E5E5: 1.26:1, against the 1.27:1 --border gives in light today. Dark
       stops changing the edge; it keeps the one light already had.
     - Over BLACK line-work the pill composites to #D1D1D1 and this edge to
       #BCBCBC: 1.24:1. The edge is the same WEIGHT against both backdrops,
       which is what an edge has to be.

     AND THAT IS WHY IT IS ALPHA AND NOT A HEX. A solid #E4E4E4 edge measures
     1.20:1 on the #D1D1D1 pill -- but INVERTED, lighter than what it edges. A
     hairline darker than its pill over paper and lighter than it over a drawn
     line changes polarity as the founder pans, and an edge that changes
     polarity reads as an artefact rather than as an edge.

     INK AND NOT BLACK, for --scrim's reason: it composites over whatever is
     there, and the ramp's darkest neutral is what the rest of the system dims
     toward. IT DOES NOT SWAP, for --veil's reason: the surface under it does
     not. */
  --veil-edge:rgba(37,37,37,.12);

  /* --figure-ground IS WHITE IN BOTH THEMES, and that is a fact about the
     content rather than an exemption from §10. A patent drawing is black
     line-work on a transparent background; composited onto #1A1A1A it is a
     blank rectangle. The dark contract swaps the tokens whose meaning is "the
     surface under our own chrome"; this one means "the paper this drawing was
     published on", which has no dark value.

     A TOKEN RATHER THAN A LITERAL because §3.2's rule is that every colour is
     a token. The gate is what stops the next white from being a judgement
     call, and a named invariant is checkable where a hex is not. */
  --figure-ground:#FFFFFF;
  /* --figure-ink AND --figure-ink-strong ARE --figure-ground's HALF OF THE
     SAME ARGUMENT. Paper does not swap, so the ink on it may not either. Every
     caption that sits ON a drawing had been taking --text-*, which does swap:
     measured in dark, the record's figure number was #8E8E8E on #FFFFFF paper
     at 3.28:1, under the 4.5:1 §3.2 sets for small text, and a caption raised
     to --text-1 was #F0F0F0 at 1.14:1 — invisible.

     THE TWO VALUES ARE LIGHT'S OWN --text-2 AND --text-1, frozen. On white
     paper they measure 7.00:1 and 14.68:1, so the quiet one clears the floor
     for 11px text and the raised one is the same step up the ramp the rest
     of the system uses. Freezing them rather than inventing a pair keeps the
     figure captions reading like every other quiet-then-raised label.

     THEY ARE NOT --text-2 AND --text-1 WITH A NOTE. A component reading a
     token that swaps, over a surface that does not, is the exact defect
     --veil-edge was added for three tokens ago. */
  --figure-ink:#595959; --figure-ink-strong:#252525;

  /* ── --scrim · the ONE dimming layer in the product ─────────────────────
     §3.2 read "there is no scrim token, and no scrim" and closed with "a
     dimming layer would arrive with whatever first needs one". This is that
     thing: the enlarged patent drawing, which became a lightbox over the
     viewport on 2026-09-24 because a drawing capped at one column of a split
     is a drawing nobody can read the reference numerals on.

     NOTHING ELSE MAY READ IT. The menus, the popovers and the record all dim
     nothing and all still close on an outside click the document hears for
     itself. A second caller is a sign the rule has stopped holding, not a
     sign the token turned out to be useful.

     .55 IS MEASURED against the stage it separates. --figure-ground is white
     in both themes, so in LIGHT theme — where the page behind is --n-2 — the
     scrim is the only thing making the lightbox's edge an edge. Composited it
     lands at #838383 and clears the white stage at 3.79:1; at .48 it drops to
     3.11 and below that it fails 3:1 outright, which is the floor for a
     boundary that is not text. Above about .65 the page stops reading as a
     page that is still there.

     THE INK IS --n-10's VALUE AND NOT BLACK, for the reason --veil is alpha:
     it composites over whatever the surface is, and the
     ramp's darkest neutral is what the rest of the system dims toward. */
  --scrim:rgba(37,37,37,.55);

  /* elevation. THEMED, which is why it is here rather than with the scale:
     an ink shadow is invisible on ink. --shadow-drop stood beside it as the
     same elevation expressed as a filter, for a composer that was clipped;
     nothing clips the composer now and nothing read it. */
  --shadow-float:0 1px 2px rgba(37,37,37,.04), 0 8px 24px -6px rgba(37,37,37,.10);
  /* --shadow-raise IS --shadow-float AT A THIRD OF THE GEOMETRY: offset 8->3,
     blur 24->8, spread -6->-3. It is the second of exactly two rungs, and the
     difference between them is how far off the page a thing is.

     A THING THAT HAS LIFTED WITHOUT LEAVING. Still in the flow, pushing
     nothing aside, under the founder's pointer -- a drawing tile coming
     toward them. It is ALWAYS paired with the 1px translate that causes it,
     because a shadow with no movement is a thing that grew rather than rose.

     THE CONTACT LAYER GOES .04 -> .05 IN LIGHT and the ambient stays at .10.
     A 1px lift needs its contact to read at all, where a floating panel has
     the ambient doing the work. The negative spread survives at both rungs,
     which is what keeps both downward-biased. */
  --shadow-raise:0 1px 2px rgba(37,37,37,.05), 0 3px 8px -3px rgba(37,37,37,.10);
}

/* ── 3 · SEMANTIC · dark · design-language.md §10 ──────────────────────────
   §10 is a contract with two halves and this is both of them.

   The mechanical half: dark redefines SEMANTIC TOKENS ONLY and touches no
   component rule. Two selectors carry the identical list — the media query so
   an unset preference follows the system, the attribute so an explicit choice
   beats the system in BOTH directions. That is why the media query is written
   :not([data-theme="light"]) rather than bare: without it, choosing light on a
   dark OS would do nothing.

   The half that is not mechanical: this is not an inversion. Surfaces stop
   being fills, and every value is picked against this ground rather than
   lightened from its light counterpart. Every number in the comments below
   was measured, the same way §10.3 measures the light set.

   The list is duplicated on purpose. CSS has no way to share a declaration
   block between two selectors, and the alternative — a third indirection
   layer of --dark-* primitives — buys nothing and hides which value is live. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  /* neutral — a re-step, not an inversion. The ground/surface step is 1.06
     against 1.08 in light, so --border does the separating that the step does
     there. §10's reading of the dark reference screen. */
  --ground:#141414; --surface:#1A1A1A; --surface-sunken:#101010;
  --border:#2E2E2E; --border-strong:#454545;
  /* the accent, achromatic here exactly as in light: the near-black fill
     becomes a near-white one and --accent-ink inverts with it. There is no
     hue to re-measure against this ground, which is the maintenance cost §3.8
     stops paying by dropping the colour — a hue chosen against white and
     carried unchanged into dark is how a component silently stops meeting
     contrast (brief.md §5). */
  --accent:#F0F0F0; --accent-ink:#141414; --accent-hover:#FFFFFF;
  --accent-on-surface:#F0F0F0;
  --text-1:#F0F0F0; --text-2:#B4B4B4; --text-3:#8E8E8E;
  --text-disabled:#5A5A5A; --text-inverse:#141414;
  /* --text-1 is the primary fill and --text-inverse its label, so a near-black
     button becomes a near-white one with no component rule changing. */
  --ink-hover:#FFFFFF; --track-pressed:#2A2A2A;



  /* the sweep is still the lighter band, so it still reads as a sweep */
  --skeleton:#2A2A2A; --skeleton-shimmer:#343434; --skeleton-strong:#424242;
  /* the stage under it stays WHITE in both themes — black line-work on #1A1A1A
     is a blank rectangle — so the veil is the light value in the dark block
     too. It is not an inversion that was forgotten: the surface this
     composites over does not swap, so neither may this. */
  --veil:rgba(255,255,255,.82);
  --veil-edge:rgba(37,37,37,.12);
  /* unchanged, deliberately: see the light block. The paper does not swap. */
  --figure-ground:#FFFFFF;
  --figure-ink:#595959; --figure-ink-strong:#252525;

  /* THE SCRIM IS BLACK HERE AND INK IN THE LIGHT BLOCK, which is a real swap
     rather than the --veil case one line up. --veil composites over a white
     drawing that does not swap, so it may not swap either; --scrim composites
     over the APP, which does. Ink at .55 over #141414 is barely a change —
     it would dim nothing, which is the one thing a scrim exists to do.

     .72 IS NOT A CONTRAST FLOOR. Against the white stage every value in the
     usable range clears 20:1 here, so the binding constraint is the other
     side: enough that the masthead and the list stop competing for the eye,
     little enough that the page reads as behind rather than gone. */
  --scrim:rgba(0,0,0,.72);

  /* an ink shadow is invisible on ink. These go black and heavier, and the
     hairline is doing most of the work regardless. */
  --shadow-float:0 1px 2px rgba(0,0,0,.40), 0 8px 24px -6px rgba(0,0,0,.55);
  --shadow-raise:0 1px 2px rgba(0,0,0,.45), 0 3px 8px -3px rgba(0,0,0,.55);
  }
}

  --accent:#F0F0F0; --accent-ink:#141414; --accent-hover:#FFFFFF;
  --accent-on-surface:#F0F0F0;
  --text-1:#F0F0F0; --text-2:#B4B4B4; --text-3:#8E8E8E;
  --text-disabled:#5A5A5A; --text-inverse:#141414;

  --skeleton:#2A2A2A; --skeleton-shimmer:#343434; --skeleton-strong:#424242;
  /* the stage under it stays WHITE in both themes — black line-work on #1A1A1A
     is a blank rectangle — so the veil is the light value in the dark block
     too. It is not an inversion that was forgotten: the surface this
     composites over does not swap, so neither may this. */
  --veil:rgba(255,255,255,.82);
  --veil-edge:rgba(37,37,37,.12);
  /* unchanged, deliberately: see the light block. The paper does not swap. */
  --figure-ground:#FFFFFF;
  --figure-ink:#595959; --figure-ink-strong:#252525;

  /* THE SCRIM IS BLACK HERE AND INK IN THE LIGHT BLOCK, which is a real swap
     rather than the --veil case one line up. --veil composites over a white
     drawing that does not swap, so it may not swap either; --scrim composites
     over the APP, which does. Ink at .55 over #141414 is barely a change —
     it would dim nothing, which is the one thing a scrim exists to do.

     .72 IS NOT A CONTRAST FLOOR. Against the white stage every value in the
     usable range clears 20:1 here, so the binding constraint is the other
     side: enough that the masthead and the list stop competing for the eye,
     little enough that the page reads as behind rather than gone. */
  --scrim:rgba(0,0,0,.72);

  /* an ink shadow is invisible on ink. These go black and heavier, and the
     hairline is doing most of the work regardless. */
  --shadow-float:0 1px 2px rgba(0,0,0,.40), 0 8px 24px -6px rgba(0,0,0,.55);
  --shadow-raise:0 1px 2px rgba(0,0,0,.45), 0 3px 8px -3px rgba(0,0,0,.55);
}

/* ── 4 · DERIVED ───────────────────────────────────────────────────────────
   EACH RESOLVES THROUGH A THEMED TOKEN, SO IT INVERTS FOR FREE. None of them
   may ever be added to a dark block: a literal there would pin the value to
   one palette while reading as perfectly correct CSS, which is the same
   failure mode as a component reading a primitive.

   Declared after the dark blocks on purpose, so that "the three blocks above
   carry the same names in the same order" is true of the blocks and nothing
   else has to be excepted from it. Position is otherwise irrelevant — custom
   properties resolve by cascade. */
:root{
  /* THE FOCUS RING IS THE ACCENT. §3.8 names three places the accent may
     appear and this is one of them, so it derives rather than being declared
     twice — one edit to --accent moves the primary fill, the selected control
     and the ring together. The accent is achromatic, so the ring is the same
     near-black/near-white pair as the ink; deriving it still matters, because
     it is what keeps the three permitted places to one declaration. */
  --focus:var(--accent);
}
/* ══ end tokens ══ */

/* ══════════════════════════════════════════════════════════════════════════
   THE BENCH — chrome around the paper. Never printed.
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--ground);color:var(--text-1);font-family:'Urbanist',system-ui,sans-serif}
.bench{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-12) var(--s-24);
  padding:var(--s-12) var(--s-24);background:var(--surface);border-bottom:1px solid var(--border)}
.bench h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.bench-g{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-8);min-width:0;max-width:100%}
.bench-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;padding:2px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface-sunken)}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:none;color:var(--text-2);
  padding:var(--s-4) var(--s-10);border-radius:var(--r-seg);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text-1);box-shadow:var(--shadow-raise)}
.bench-btn{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:var(--r-control);
  padding:var(--s-6) var(--s-14);background:var(--accent);color:var(--accent-ink);cursor:pointer}
@media (max-width:640px){.bench{position:static}}
@media (hover:hover){
  .seg button:hover{color:var(--text-1)}
  .bench-btn:hover{background:var(--accent-hover)}
}
.bench-note{flex-basis:100%;margin:0;font-size:13px;color:var(--text-2)}
.bench-over{font-size:11px;font-family:'Inconsolata',monospace;color:var(--text-2)}
.bench-over[data-n]:not([data-n="0"]){color:var(--text-1);font-weight:500}

.desk{display:flex;flex-direction:column;align-items:center;gap:var(--s-32);padding:var(--s-40) var(--s-16) var(--s-72)}
.desk-say{font-size:13px;color:var(--text-2);max-width:816px;width:100%;margin:0}

/* ══════════════════════════════════════════════════════════════════════════
   THE PAPER — what every direction shares. Geometry only; the look is below.
   ══════════════════════════════════════════════════════════════════════════ */
.pg{position:relative;width:816px;height:1056px;flex:none;display:flex;flex-direction:column;
  padding:var(--pt) var(--px) var(--pb);background:var(--paper);color:var(--ink);overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.08);
  font-family:var(--f-text);font-size:var(--fs-body);line-height:1.5;font-kerning:normal;
  zoom:var(--zoom,1)}
.pg[data-over]{outline:2px dashed var(--signal-over,#C00);outline-offset:4px}
.pg-in{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.run,.ft{flex:none}
.ft{margin-top:auto}
.pg p,.pg h2,.pg h3,.pg h4,.pg dl,.pg dd,.pg ol,.pg ul,.pg figure{margin:0}
.pg ol,.pg ul{padding:0;list-style:none}
.pg table{border-collapse:collapse;width:100%}
.pg th,.pg td{padding:0;text-align:left;font-weight:inherit;vertical-align:baseline}
.n,.pg .num{font-family:var(--f-num);font-variant-numeric:lining-nums tabular-nums}
.grow{flex:1 1 auto}
.sk{display:inline-block;height:.62em;width:var(--w,60%);border-radius:2px;background:var(--sk);vertical-align:middle}
.skp{display:block;margin:.55em 0}
.mk{display:inline-block;vertical-align:middle;flex:none}
.cite{font-family:var(--f-num);font-size:11px;color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.bal{text-wrap:balance}
.pretty{text-wrap:pretty}

/* Only on screen: the Run button and the Pro part before it runs. */
.only-screen{display:none}
:root[data-view="screen"] .only-screen{display:revert}
:root[data-view="screen"] .pg{height:auto;min-height:0}
:root[data-view="screen"] .pg-cover{min-height:760px}
:root[data-view="screen"] .ft .pgno{visibility:hidden}

/* the charts, in shape; every direction colours them */
.hb{display:grid;grid-template-columns:minmax(0,auto) 1fr auto;column-gap:var(--s-12);row-gap:var(--hb-gap,8px);align-items:center}
.hb-k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.bar-c{display:block;height:var(--bar-h,8px)}
.bar{display:block;height:100%;background:var(--bar)}
.bar.dim{background:var(--bar-dim)}
.hb-n{text-align:right;min-width:2.5em}
.ht td,.ht th{padding:var(--row-p,7px) 0;border-bottom:1px solid var(--hair)}
.ht th{padding-right:var(--s-16);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht .bc{width:34%;padding-right:var(--s-12)}
.ht .r{text-align:right;width:3.5em}
.ht .tot th,.ht .tot td{border-bottom:0;border-top:1px solid var(--ink);font-weight:600}
.sub{color:var(--ink-3);font-size:11px;margin-left:.35em}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;border-bottom:1px solid var(--ink)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative}
.col-b{background:var(--bar);min-height:1px}
.col.inc .col-b{background:transparent;box-shadow:inset 0 0 0 1px var(--bar)}
.col-v{text-align:center;font-size:var(--fs-micro);color:var(--ink-2);margin-bottom:3px}
.yrs{display:flex;gap:6px;margin-top:4px}
.yrs span{flex:1;text-align:center;font-size:var(--fs-micro);color:var(--ink-3)}
.split{display:flex;height:var(--split-h,28px);gap:2px}
.split span{min-width:2px;background:var(--bar)}
.split .dim{background:var(--bar-dim)}
.split .none{background:repeating-linear-gradient(135deg,var(--bar-dim) 0 2px,transparent 2px 5px)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s-6) var(--s-20);margin-top:var(--s-10);font-size:var(--fs-small);color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--bar)}
.legend i.dim{background:var(--bar-dim)}
.legend i.none{background:repeating-linear-gradient(135deg,var(--bar-dim) 0 2px,transparent 2px 5px)}
.gt th,.gt td{padding:var(--row-p,7px) var(--s-8);border-bottom:1px solid var(--hair);text-align:right}
.gt th:first-child,.gt td:first-child{text-align:left;padding-left:0}
.gt thead th{font-size:var(--fs-micro);color:var(--ink-3);border-bottom:1px solid var(--ink)}
.gt .t{font-weight:600}
.cc th,.cc td{padding:var(--row-p,7px) var(--s-8);border-bottom:1px solid var(--hair)}
.cc th:first-child{padding-left:0}
.cc thead th{font-size:var(--fs-micro);color:var(--ink-3);border-bottom:1px solid var(--ink)}
.cc .m{white-space:nowrap}
.cc .m b{font-weight:400;font-family:var(--f-num);margin-right:6px}
.apx td,.apx th{padding:var(--row-p,6px) var(--s-8);border-bottom:1px solid var(--hair);font-size:var(--fs-small)}
.apx td:first-child,.apx th:first-child{padding-left:0}
.apx thead th{font-size:var(--fs-micro);color:var(--ink-3);border-bottom:1px solid var(--ink)}
.apx .hold{display:block;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc li{display:flex;align-items:baseline;gap:var(--s-8)}
.toc .dots{flex:1;border-bottom:1px dotted var(--ink-3);transform:translateY(-4px);min-width:24px}
.pro-list li{display:grid;grid-template-columns:1.6em 1fr;gap:0 var(--s-4)}
.pro-list li+li{margin-top:var(--s-10)}
.ex-num{display:none}

/* ══════════════════════════════════════════════════════════════════════════
   THE BRAND, which the report is set in: Urbanist for text,
   Inconsolata for every number, the ink pair, no hue. Tokens only.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:var(--surface);--ink:var(--text-1);--ink-2:var(--text-2);--ink-3:var(--text-3);
  --hair:var(--border);--rule:var(--text-1);--bar:var(--text-1);--bar-dim:var(--border-strong);--sk:var(--skeleton);
  --f-text:'Urbanist',system-ui,sans-serif;--f-num:'Inconsolata',ui-monospace,monospace;
  --fs-micro:11px;--fs-small:13px;--fs-body:13px}
/* THE LOCKUP: the submark and TIS bold, the product name regular */
.brand b{font-weight:700}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-chip);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1;background:var(--text-1);color:var(--text-inverse)}
.run-btn{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:var(--r-control);padding:10px 16px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.ht .tot .n,.gt .t{font-weight:500}

/* ══════════════════════════════════════════════════════════════════════════
   THE COVER — Framed Folio's: the ink pair inverted, the accent and not a
   hue, mounted flush inside a double hairline frame, the figures beneath.
   ══════════════════════════════════════════════════════════════════════════ */
:root[data-dir="baseline"] .pg-cover{padding:0}
:root[data-dir="baseline"] .cv-band{background:var(--text-1);color:var(--text-inverse);padding:var(--s-40) var(--px) var(--s-56);height:600px;display:flex;flex-direction:column}
:root[data-dir="baseline"] .cv-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.12em}
:root[data-dir="baseline"] .cv-top .brand{display:flex;align-items:center;gap:10px}
:root[data-dir="baseline"] .cv-top .d{font-weight:500;letter-spacing:.08em;opacity:.72}
:root[data-dir="baseline"] .cv-kick{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.72;margin-bottom:var(--s-16)}
:root[data-dir="baseline"] .cv-q{font-size:36px;line-height:1.15;font-weight:500;letter-spacing:-.01em;max-width:560px}
:root[data-dir="baseline"] .cv-low{padding:var(--s-40) var(--px) var(--s-36,36px);display:flex;flex-direction:column;flex:1}
:root[data-dir="baseline"] .cv-figs{display:grid;grid-template-columns:repeat(4,1fr)}
:root[data-dir="baseline"] .cv-figs div{padding:0 var(--s-16);border-left:1px solid var(--hair)}
:root[data-dir="baseline"] .cv-figs div:first-child{padding-left:0;border-left:0}
:root[data-dir="baseline"] .cv-figs dt{font-family:var(--f-num);font-size:36px;font-weight:500;line-height:1}
:root[data-dir="baseline"] .cv-figs dd{font-size:13px;color:var(--ink-2);margin-top:var(--s-8)}
:root[data-dir="baseline"] .cv-about{margin-top:var(--s-40);display:grid;grid-template-columns:120px 1fr;gap:var(--s-10) var(--s-24);font-size:13px;line-height:1.55}
:root[data-dir="baseline"] .cv-about dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding-top:2px}

/* ══════════════════════════════════════════════════════════════════════════
   AT A GLANCE — page 3: the key figures, the bottom
   line, and every counted exhibit small, with the page of its full version.
   ══════════════════════════════════════════════════════════════════════════ */
.pg .gl-figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s-16);padding:var(--s-16);margin-bottom:var(--s-24);background:var(--surface-sunken)}
.pg .gl-figs dt{font-family:var(--f-num);font-size:26px;font-weight:500;line-height:1.1}
.pg .gl-figs dd{font-size:11px;line-height:1.35;color:var(--ink-2);margin-top:var(--s-4)}
.pg .gl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-24);margin-top:var(--s-8)}
.pg .gl-l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pg .gl-h{font-size:13px;font-weight:600;line-height:1.35;margin:var(--s-4) 0 var(--s-10);min-height:4.05em}
.pg .gl-b{font-size:11px;--bar-h:6px;--hb-gap:4px;--split-h:14px}
.pg .gl-b .hb-k{max-width:92px}
.pg .gl-b .cols{height:72px;gap:2px;padding-top:0}
.pg .gl-b .col-v{display:none}
.pg .gl-b .yrs{gap:2px}
.pg .gl-b .legend{font-size:11px;gap:var(--s-4) var(--s-12);margin-top:var(--s-6)}
.pg .gl-b .ex-note{display:none}
.pg .gl-p{font-size:11px;color:var(--ink-3);margin-top:var(--s-10)}

/* ══════════════════════════════════════════════════════════════════════════
   THE BODY — Ledger's, ruled like a ledger: a hairline
   frame on every page, small exhibits that share a base paired side by side
   across a vertical rule, large ones full width.
   ══════════════════════════════════════════════════════════════════════════ */
:root[data-dir="baseline"]{--px:72px;--pt:56px;--pb:52px;--row-p:5px;--hb-gap:6px}
:root[data-dir="baseline"] .pg:not(.pg-cover)::before{content:"";position:absolute;inset:36px;border:1px solid var(--border);pointer-events:none}
:root[data-dir="baseline"] .run{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding-bottom:var(--s-12);border-bottom:1px solid var(--hair);margin-bottom:var(--s-32)}
:root[data-dir="baseline"] .brand{display:flex;align-items:center;gap:8px;color:var(--ink);letter-spacing:.12em;font-weight:400}
/* the lockup on the cover band takes the band's inverse ink */
:root[data-dir="baseline"] .cv-top .brand{color:inherit}
:root[data-dir="baseline"] .ft{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding-top:var(--s-12);border-top:1px solid var(--hair)}
:root[data-dir="baseline"] .op{margin-bottom:var(--s-32)}
:root[data-dir="baseline"] .op-n,:root[data-dir="baseline"] .lbl,:root[data-dir="baseline"] .ex-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
:root[data-dir="baseline"] .op-n{margin-bottom:var(--s-6)}
:root[data-dir="baseline"] .op-t{font-size:26px;line-height:1.2;font-weight:500}
:root[data-dir="baseline"] .op-s{font-size:13px;color:var(--ink-2);margin-top:var(--s-8);max-width:560px}
:root[data-dir="baseline"] .memo{display:grid;grid-template-columns:120px 1fr;gap:var(--s-10) var(--s-24);padding:var(--s-16) 0;border-top:2px solid var(--rule);border-bottom:1px solid var(--hair);font-size:13px}
:root[data-dir="baseline"] .memo dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding-top:2px}
:root[data-dir="baseline"] .m-body{display:grid;grid-template-columns:168px 1fr;gap:var(--s-40);margin-top:var(--s-32)}
:root[data-dir="baseline"] .kf div{padding:var(--s-12) 0;border-bottom:1px solid var(--hair)}
:root[data-dir="baseline"] .kf div:first-child{padding-top:0}
:root[data-dir="baseline"] .kf dt{font-family:var(--f-num);font-size:20px;font-weight:500;line-height:1.2}
:root[data-dir="baseline"] .kf dd{font-size:13px;color:var(--ink-2)}
:root[data-dir="baseline"] .lbl{margin-bottom:var(--s-10)}
:root[data-dir="baseline"] .lead{padding-bottom:var(--s-24);margin-bottom:var(--s-24);border-bottom:1px solid var(--hair)}
:root[data-dir="baseline"] .lead h3,:root[data-dir="baseline"] .ps h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:var(--s-8);margin-bottom:var(--s-6)}
:root[data-dir="baseline"] .lead p{font-size:13px;line-height:1.6}
:root[data-dir="baseline"] .toc li{font-size:13px;padding:6px 0}
:root[data-dir="baseline"] .ex-t{font-size:16px;line-height:1.35;font-weight:600;margin:var(--s-6) 0 var(--s-16)}
:root[data-dir="baseline"] .ex-note{font-size:13px;color:var(--ink-2);margin-top:var(--s-12)}
:root[data-dir="baseline"] .ex-src{font-size:11px;color:var(--ink-3);margin-top:var(--s-12);padding-top:var(--s-8);border-top:1px solid var(--hair)}
:root[data-dir="baseline"] :is(.ex,.pair) + :is(.ex,.pair){margin-top:var(--s-24);padding-top:var(--s-24);border-top:1px solid var(--rule)}
:root[data-dir="baseline"] .pair{display:grid;grid-template-columns:1fr 1fr}
:root[data-dir="baseline"] .pair .ex:first-child{padding-right:var(--s-24)}
:root[data-dir="baseline"] .pair .ex + .ex{margin:0;padding:0 0 0 var(--s-24);border-top:0;border-left:1px solid var(--hair)}
:root[data-dir="baseline"] .pair .hb-k{max-width:120px}
:root[data-dir="baseline"] .band{display:flex;justify-content:space-between;align-items:center;gap:var(--s-20);background:var(--surface-sunken);border-left:3px solid var(--rule);padding:var(--s-12) var(--s-16);margin-bottom:var(--s-32);font-size:13px;color:var(--ink-2)}
:root[data-dir="baseline"] .band h2{display:none}
:root[data-dir="baseline"] .ps + .ps{margin-top:var(--s-24);padding-top:var(--s-24);border-top:1px solid var(--hair)}
:root[data-dir="baseline"] .ps-q{font-size:13px;color:var(--ink-3);margin-bottom:var(--s-12)}
:root[data-dir="baseline"] .ps-b{font-size:13px;line-height:1.6}
/* reading text holds a measure; the tables beside it keep the full width */
:root[data-dir="baseline"] .ps-q,:root[data-dir="baseline"] .ps-b > p,:root[data-dir="baseline"] .ps-b .pro-list,:root[data-dir="baseline"] .ex-note,:root[data-dir="baseline"] .disc{max-width:72ch}
:root[data-dir="baseline"] .ps-b p + p{margin-top:var(--s-8)}
:root[data-dir="baseline"] .disc{font-size:11px;line-height:1.55;color:var(--ink-3);margin-top:var(--s-32);padding-top:var(--s-12);border-top:1px solid var(--hair)}
:root[data-dir="baseline"] .cl-list li{padding:var(--s-16) 0;border-bottom:1px solid var(--hair)}
:root[data-dir="baseline"] .cl-list li:first-child{border-top:2px solid var(--rule)}
:root[data-dir="baseline"] .cl-list h3{font-size:16px;font-weight:600;margin-bottom:var(--s-4)}
:root[data-dir="baseline"] .cl-list p{font-size:13px;color:var(--ink-2);max-width:64ch}
:root[data-dir="baseline"] .cl-made{margin-top:var(--s-32)}


/* ══════════════════════════════════════════════════════════════════════════
   A HAND-WRITTEN SET (?set=) — the sections only a set with readings has.
   Same ink pair, same hairlines; every mark is ink or the dim bar.
   ══════════════════════════════════════════════════════════════════════════ */
/* a sentence's tag: C checkable, R a reading, O outside the record */
.st{display:inline-block;font-family:var(--f-num);font-size:11px;line-height:1;padding:2px 3px 1px;margin-left:4px;border:1px solid var(--hair);border-radius:2px;color:var(--ink-3);vertical-align:1px}
.st-O{border-color:var(--ink-3);color:var(--ink-2)}

<script type="module">
import { esc } from '../../app/js/core/dom.mjs';

/* ══ A HAND-WRITTEN SET, when ?set= names one on disk ════════════════════ */
let SET = null;
{

const descGiven = () => !SET || document.documentElement.dataset.desc !== 'none';

/* ══ ?blocks=demo · THE CONTRACT'S NINE KINDS, DRAWN ══════════════════════
   The illustrative result in demo/pro-blocks.mjs — the same one the package
   prints as contract/examples/pro-result-blocks.json — laid out by app/'s
   own renderer, a page per section, so the engine's output can be checked
   against a drawing. Its content is invented; the shapes are the contract. */
const PB = new URLSearchParams(location.search).get('blocks') === 'demo' ? await import('../../demo/pro-blocks.mjs') : null;

function blockSecs() {
  const secn = Object.fromEntries(PB.SECTIONS.map((x, i) => [x.key, `2.${i + 1}`]));
  const exn = { holders: 1, years: 2, status: 3 };
  const ctx = { section: k => secn[k] || '', exhibit: k => exn[k] || '', patent: r => `Patent ${r}, fictional` };
  const tag = '<span class="tag">Pro</span>';
  const out = [{ key: 'blk', cls: '', blocks: [`<header class="op"><p class="op-n">The block kinds</p><h2 class="op-t bal">A Pro result, drawn</h2><p class="op-s pretty">contract/examples/pro-result-blocks.json, through the renderer app/ uses. The content is invented, about a fictional frame and three fictional patents; the shapes are the contract, and what a section says is yours.</p></header>`] }];
  PB.SECTIONS.forEach((x, i) => {
    const got = PB.RESULT.sections.find(r => r.key === x.key);
    const b = drawBlocks(got ? got.blocks : [], ctx);
    out.push({ key: `blk${i}`, cls: 'pg-pro1', blocks: [`<section class="ps"><h3><span class="n hn">2.${i + 1}</span>${esc(x.title)} ${tag}</h3><p class="ps-q pretty">${esc(x.question)}</p><div class="ps-b">${b[0] || ''}</div></section>`, ...b.slice(1).map(h => `<div class="ps-b ps-cont">${h}</div>`)] });
  });

}

/* ══ THE ENGINE SEAM, as app/js/main.mjs has it ══════════════════════════ */
async function engine() {
  if (new URLSearchParams(location.search).get('data') === 'demo') return ['demo', (await import('../../demo/engine.mjs')).default];
  try { return ['corpus', (await import('../../corpus/engine.mjs')).default]; }
  catch { return ['demo', (await import('../../demo/engine.mjs')).default]; }
}

/* The description the report reads against. Written for the domain each
   engine actually holds, so the counts beneath it are not absurd. */
const IDEA = {
  corpus: 'A compute-in-memory accelerator that runs neural-network inference inside an SRAM array, for low-power edge devices.',

};
const STARS = 12;

/* ══ THE REPORT, as app/js/surfaces/report.mjs carries it ═════════════════ */
const REPORT = {
  name: 'Patent report', ask: 'How close are these patents to the idea, and who holds them?',
  counted: ['holders', 'status', 'years', 'offices', 'classes', 'cluster', 'licence'],
  lead: ['From Part 2', 'One paragraph on the closest patents, citing their numbers.'],

};

const today = new Date();
const D = {
  short: today.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),

  day: today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
  iso: `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`,
};
const LAG = new Date(today.getFullYear(), today.getMonth() - 18, today.getDate()).getFullYear();
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const pct = (n, of) => of ? Math.round(n / of * 100) + '%' : '';
const sk = w => `<span class="sk" style="--w:${w}%"></span>`;
const skp = w => `<span class="sk skp" style="--w:${w}%"></span>`;

/* ══ the model: everything any direction may print, computed once ════════ */
function statusOf(rows) {
  const s = { grant: 0, application: 0, unknown: 0 };
  for (const r of rows) { const k = r.versions?.[0]?.kind; s[k === 'grant' || k === 'application' ? k : 'unknown']++; }

}
function holderRows(c) {

  const withheld = c.holders.find(h => h.name === null), none = c.holders.find(h => h.name === '');
  const rows = top.map(h => ({ label: esc(h.name), n: h.n }));
  if (withheld) rows.push({ label: sk(46), n: withheld.n, dim: true });
  if (rest.length) rows.push({ label: `Others<span class="sub">${plural(rest.length, 'holder', 'holders')}</span>`, n: rest.reduce((a, h) => a + h.n, 0), dim: true });

}
function yearSpan(c) {
  const ys = c.years.filter(([y]) => y != null).map(([y]) => y);
  if (!ys.length) return [];
  const lo = Math.max(Math.min(...ys), Math.max(...ys) - 11), hi = Math.max(...ys), by = new Map(c.years), out = [];
  for (let y = lo; y <= hi; y++) out.push([y, by.get(y) || 0]);

/* the chart bodies — one markup, three stylesheets */
const holderTable = (c) => {
  const { rows } = holderRows(c), m = Math.max(1, ...rows.map(r => r.n));
  return `<table class="ht"><tbody>${rows.map(r => `<tr><th scope="row">${r.label}</th><td class="bc"><span class="bar-c"><span class="bar${r.dim ? ' dim' : ''}" style="width:${(r.n / m * 100).toFixed(1)}%"></span></span></td><td class="r n">${r.n}</td><td class="r n">${pct(r.n, c.results)}</td></tr>`).join('')}
    <tr class="tot"><th scope="row">Total</th><td></td><td class="r n">${c.results}</td><td class="r n">100%</td></tr></tbody></table>`;
};
const hbars = rows => {
  const m = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="hb">${rows.map(([k, n, dim]) => `<span class="hb-k">${k}</span><span class="bar-c"><span class="bar${dim ? ' dim' : ''}" style="width:${(n / m * 100).toFixed(1)}%"></span></span><span class="hb-n n">${n}</span>`).join('')}</div>`;
};
const yearBars = c => {
  const span = yearSpan(c);
  if (!span.length) return `<p class="ex-note">No filing dates came back for these results.</p>`;
  const m = Math.max(1, ...span.map(s => s[1]));
  return `<div class="cols">${span.map(([y, n]) => `<div class="col${y >= LAG ? ' inc' : ''}"><span class="col-v n">${n}</span><span class="col-b" style="height:${(n / m * 100).toFixed(1)}%"></span></div>`).join('')}</div>
    <div class="yrs">${span.map(([y]) => `<span class="n">${String(y).slice(2)}</span>`).join('')}</div>`;
};
const clusterGrid = c => {
  const ys = c.years.filter(([y]) => y != null).map(([y]) => y);
  if (!ys.length) return `<p class="ex-note">No filing dates came back for these results.</p>`;
  const hi = Math.max(...ys), lo = Math.min(...ys), periods = [];
  /* a hand-written set spans its own years, so every row adds up to its
     total; the bench keeps the field's last ten years */
  if (SET) { const w = Math.max(2, Math.ceil((hi - lo + 1) / 5)); for (let a = lo; a <= hi; a += w) periods.push([a, Math.min(a + w - 1, hi)]); }
  else for (let i = 4; i >= 0; i--) periods.push([hi - 2 * i - 1, hi - 2 * i]);
  const sum = (by, a, b) => { let n = 0; for (let y = a; y <= b; y++) n += by.get(y) || 0; return n; };
  const rows = c.classYears.filter(([k]) => k).slice(0, 4);
  if (!rows.length) return `<p class="ex-note">No classification came back for these results.</p>`;
  return `<table class="gt"><thead><tr><th scope="col">Class</th>${periods.map(([a, b]) => `<th scope="col" class="n">${a === b ? a : `${a}–${String(b).slice(2)}`}</th>`).join('')}<th scope="col">All years</th></tr></thead><tbody>${rows.map(([k, yrs]) => {
    const by = new Map(yrs), total = yrs.reduce((s, [, n]) => s + n, 0);
    return `<tr><th scope="row" class="n">${esc(k)}</th>${periods.map(([a, b]) => `<td class="n">${sum(by, a, b)}</td>`).join('')}<td class="n t">${total}</td></tr>`;
  }).join('')}</tbody></table>`;

/* In a hand-written set the results are the starred set, so the exhibits say
   so rather than calling ten records "results". */
const noun = s => !SET ? s : s.replace(/these results/g, 'the starred patents').replace(/(\d+) results/g, '$1 starred patents').replace(/\bresults\b/g, 'starred patents');
function exhibit(key, c, rows) {
  const e = exhibitOf(key, c, rows);
  if (!e || !SET) return e;
  const W = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  let title = noun(e.title), body = e.body;
  /* a title never singles out one of a tie */
  if (key === 'classes') {
    const named = c.classes.filter(([k]) => k);
    if (named.length > 1 && named[0][1] === named[1][1]) {
      const top = named[0][1], tie = named.filter(([, n]) => n === top).length;
      title = `No class holds more than ${top} of the ${rows.length}; ${W[tie] || tie} tie at ${top}.`;
    }
  }
  if (key === 'offices') title = title.replace(/ in US\./, ' in the US.');
  if (key === 'cluster') title = 'The four largest classes by filing period; every row adds up to its total.';
  if (key === 'status') body = body.replace(/Pending/g, 'Application');
  return { ...e, title, body, base: noun(e.base), ...(key === 'holders' && SET.HOLDER_NOTE ? { note: cites(SET.HOLDER_NOTE) } : {}) };
}
function exhibitOf(key, c, rows) {

  if (SET) { const e = setExhibit(key, c, rows); if (e) return e; }

    const none = (c.holders.find(h => h.name === '') || {}).n || 0;
    const title = top.length
      ? `${top.length === 1 ? 'One holder accounts' : `${['', 'One', 'Two', 'Three'][top.length]} holders account`} for ${held} of ${c.results} results${none ? `; ${none} name no holder` : ''}.`
      : `The holders of these ${c.results} results are withheld.`;
    return { label: 'Who holds them', title, base: field, body: holderTable(c) };
  }
  if (key === 'years') {
    const span = yearSpan(c), peak = span.reduce((a, s) => (s[1] > a[1] ? s : a), [null, -1]);
    return { label: 'Filed by year', title: peak[0] ? `Filings in these results peak in ${peak[0]}.` : 'No filing dates came back.', base: field, body: yearBars(c),
      note: `Filing year. Applications publish about 18 months after filing, so ${LAG} onward is incomplete and drawn in outline.` };
  }
  if (key === 'offices') {
    const rowsO = c.offices.map(([w, n]) => [w ? esc(codeOf(w) || w) : 'Not recorded', n, !w]);
    const named = c.offices.filter(([w]) => w);
    const title = named.length ? `${named[0][1]} of ${c.results} results ${named[0][1] === 1 ? 'was' : 'were'} filed in ${esc(codeOf(named[0][0]) || named[0][0])}.` : 'No office came back for these results.';
    return { label: 'Where they were filed', title, base: field, body: hbars(rowsO) };
  }
  if (key === 'classes') {
    const named = c.classes.filter(([k]) => k), top = named.slice(0, 4), restN = named.slice(4).reduce((a, [, n]) => a + n, 0);
    const none = (c.classes.find(([k]) => !k) || [0, 0])[1];
    const rowsC = [...top.map(([k, n]) => [`<span class="n">${esc(k)}</span>`, n]), ...(restN ? [['Other classes', restN, true]] : []), ...(none ? [['Unclassified', none, true]] : [])];
    const title = top.length ? `${top[0][1]} of ${c.results} results sit in ${esc(top[0][0])}.` : 'No classification came back for these results.';
    return { label: 'Technology classes', title, base: field, body: hbars(rowsC) };
  }
  if (key === 'cluster') {
    return { label: 'Where filings cluster', title: 'The four largest classes across five two-year periods.', base: field, body: clusterGrid(c),
      note: `Counts per class and period. ${LAG} onward is incomplete.` };
  }
  if (key === 'status') {

    const segs = [['Granted', s.grant, ''], ['Pending', s.application, 'dim'], ['Not recorded', s.unknown, 'none']].filter(x => x[1]);
    return { label: 'Granted and pending', title: `${s.grant} of the ${rows.length} starred patents are granted; ${s.application} are applications.`, base: starred,
      body: `<div class="split">${segs.map(([, n, cls]) => `<span class="${cls}" style="flex:${n}"></span>`).join('')}</div>
        <div class="legend">${segs.map(([l, n, cls]) => `<span><i class="${cls}"></i>${l} <span class="n">${n}</span></span>`).join('')}</div>` };
  }
  if (key === 'licence') {
    return { label: 'Listed for licence on TIS', title: 'Which starred patents are listed on TIS’s licensing platform.', base: starred,
      body: `${skp(70)}${skp(42)}`, note: 'The listing is TIS-side data and is not connected yet.' };

/* ══ A HAND-WRITTEN SET'S OWN SECTIONS ════════════════════════════════════

const TAG = { C: 'Checkable against the rows', R: 'A reading', O: 'Outside the record' };

      note: 'Filing year as recorded. For several US records this may be a PCT or national-entry date rather than the earliest priority, and no record gives a priority date.' };
  }

    const f = rows.map(r => r.filed), p = rows.map(r => r.published);
    const lo = Number(f.reduce((a, b) => a < b ? a : b).slice(0, 4)), hi = Number(p.reduce((a, b) => a > b ? a : b).slice(0, 4)) + 1;
    const t0 = Date.parse(`${lo}-01-01`), t1 = Date.parse(`${hi}-01-01`), x = d => (Date.parse(d) - t0) / (t1 - t0) * 100;

      const app = r.versions[0].kind !== 'grant';
      return `<span class="tl-k"><span class="n">[${r.ref}]</span><span class="n">${esc(r.number)}</span></span><span class="tl-t"><span class="tl-s" style="left:${x(r.filed).toFixed(2)}%;width:${(x(r.published) - x(r.filed)).toFixed(2)}%"></span><span class="tl-f" style="left:${x(r.filed).toFixed(2)}%"></span><span class="tl-p${app ? ' app' : ''}" style="left:${x(r.published).toFixed(2)}%"></span></span>`;
    }).join('')}<div class="tl-ax">${ticks.map(y => `<span class="n" style="left:${x(`${y}-01-01`).toFixed(2)}%">${y}</span>`).join('')}</div></div>
      <div class="tl-lg"><span><i class="f"></i>Filed</span><span><i class="g"></i>Granted, on its grant date</span><span><i class="a"></i>Application, on its publication date</span></div>`;
    const yr = s => s.slice(0, 4);
    return { label: 'Filed to published', title: `Filed from ${yr(f[0])} to ${yr(f.reduce((a, b) => a > b ? a : b))}, published from ${yr(p.reduce((a, b) => a < b ? a : b))} to ${yr(p.reduce((a, b) => a > b ? a : b))}.`, base: starred, body,

    return { label: 'Inventors', title: I.exact.length ? `${I.exact.length} inventor names appear on more than one record.` : `${total} inventor names on ${rows.length} records; none appears on two.`, base: starred,
      body: `<ol class="nl">${rows.map(r => `<li><span class="n">[${r.ref}]</span><span><span class="n">${esc(r.number)}</span> · ${r.inventors.map(esc).join(', ')}</span></li>`).join('')}</ol>`, note: esc(I.note) };

      body: `<ol class="nl">${A.map(([r, s]) => `<li><span class="n">[${r}]</span><span><span class="n">${esc(byRef(r).number)}</span>. ${cites(s)}</span></li>`).join('')}</ol>`,

    return { label: 'What the set does not contain', title: esc(L.title), base: starred,
      body: `<div class="lk">${dl('In the records', L.have)}${dl('Not in any record', L.missing)}</div>` };
  }
  return null;

/* Part 2, in a hand-written set: the sections, then what each one holds. */
function setPro() {
  const given = descGiven();
  return [
    given ? ['Closest claims', 'The idea’s features against each closest claim 1. A claim reaches an idea only if every one of its elements does.', 'chart']
          : ['Where the claims sit against a product', 'With no description, each line names a thing a product might do and the claims to read against it.', 'watch'],
    ...(given ? [['Where the idea may differ', 'Changes that may take the idea away from the closest claims, each citing the claim it moves away from.', 'differ']] : []),
    ['How the set divides', 'What each claim 1 requires, grouped; how many elements each carries; which records may be one invention.', 'groups'],
    ['What’s already described', 'What these patents already describe that a product might also do. The set is not a prior-art search.', 'described'],
    ['Claimed interactions', 'Every operator gesture the claims tie to a flight effect, and whether it sits in claim 1 or a dependent claim.', 'gestures'],
    ['What no claim in this set reaches', 'Where each claim 1 sits in a formation product, and the parts of one that no claim 1 here is directed at.', 'layers'],
    ['Other holders in the set', 'Each holder with its starred patents, and what they cover.', 'holders'],
    ['Risk flags', 'What to check before building or backing it. Each flag gives its basis and the patents behind it. No score.', 'risks'],
    ['Conclusion', 'Who is here, how close the nearest claim comes, what is open, and what to check — each answer citing the exhibits and sections it rests on.', 'conclusion'],
    ['Each patent in plain English', 'For every starred patent: what it is, what claim 1 requires, and what sits only in dependent claims.', 'each'],

}
const concOf = () => SET.PRO.conclusion.map((c, i) => !descGiven() && SET.PRO.conclusionNone && SET.PRO.conclusionNone.at === i ? SET.PRO.conclusionNone : c);
const MK = { P: ['●', 'Present'], U: ['◐', 'Unclear'], A: ['○', 'Absent'] };
function setBody(kind) {
  const P = SET.PRO;

    const ch = P.chart;
    return `<table class="cc"><thead><tr><th scope="col">Feature of the idea</th>${ch.cols.map(r => `<th scope="col"><span class="n">[${r}]</span><span class="n nw">${esc(byRef(r).number)}</span>claim 1</th>`).join('')}</tr></thead><tbody>${SET.FEATURES.map((f, i) => `<tr><th scope="row">${esc(f)}</th>${ch.marks[i].map(([k, w]) => `<td class="m2"><b>${MK[k][0]}</b>${MK[k][1]}<span class="why">${cites(w)}</span></td>`).join('')}</tr>`).join('')}</tbody></table>

  }

  if (kind === 'differ') return `<ol class="pro-list">${P.differ.map((s, i) => `<li><span class="n">${i + 1}.</span><span class="pretty">${say(s)}</span></li>`).join('')}</ol>`;

    return `<table class="grp"><tbody>${P.groups.map(([g, rs, n]) => `<tr><th scope="row">${esc(g)}${n ? `<span class="why">${esc(n)}</span>` : ''}</th><td>${refs(rs)}</td><td class="c">${rs.length}</td></tr>`).join('')}</tbody></table>
      <p class="sub-h">Elements in each claim 1</p>${hbars(P.breadth.map(([r, n]) => [`<span class="n">[${r}] ${esc(byRef(r).number)}</span>`, n]))}
      <p class="ex-note">Counted by splitting claim 1 at its elements, which is itself a reading. Fewer elements generally ask less of a product; it is not a measure of strength.</p>
      <p class="sub-h">Notes</p><ul class="rest">${P.groupNotes.map(s => `<li>${say(s)}</li>`).join('')}</ul>`;
  }

      <p class="sub-h">Safety features already in the claims</p><ol class="nl">${P.safety.map(([s, rs, w]) => `<li><span class="n">${rs.map(r => `[${r}]`).join('')}</span><span>${esc(s)} <span class="refs">${esc(w)}</span></span></li>`).join('')}</ol>
      <p class="sub-h">Earlier and later in the set</p><ul class="rest">${P.chronology.map(s => `<li>${say(s)}</li>`).join('')}</ul>`;
  if (kind === 'gestures') return `<div class="gx"><span class="gx-h">The operator does</span><span class="gx-h"></span><span class="gx-h">The claim says the vehicles</span><span class="gx-h" style="text-align:right">Where</span>${P.gestures.map(([g, e, r, w, c1]) => `<span class="gx-g${c1 ? ' c1' : ''}">${esc(g)}</span><span class="gx-a"></span><span class="gx-e">${esc(e)}</span><span class="gx-c">[${r}] ${esc(w)}</span>`).join('')}</div>
      <p class="key"><span><i class="bx c1"></i>In claim 1</span><span><i class="bx"></i>In a dependent claim only</span></p>`;

      <p class="key"><span>Columns are appendix rows 1–${n}. A dot: claim 1 is directed at that layer.</span></p>
      <ul class="rest">${L.notes.map(s => `<li>${say(s)}</li>`).join('')}</ul>`;
  }
  if (kind === 'holders') return `<ol class="nl">${P.holders.map(([h, rs, s, t]) => `<li><span class="n">${rs.map(r => `[${r}]`).join('')}</span><span><b>${esc(h)}</b>, <span class="n">${plural(rs.length, 'patent', 'patents')}</span>. ${say([s, t || 'R'])}</span></li>`).join('')}</ol>`;
  if (kind === 'risks') return `<ol class="pro-list">${P.risks.map(([f, rs, b, t], i) => `<li><span class="n">${i + 1}.</span><span><b>${esc(f)}</b>${refs(rs)}. ${say([b, t])}</span></li>`).join('')}</ol>`;

    const asks = `<div class="cn-c cn-qs"><h4><span class="n">→</span>Ask the team</h4><ol>${C.filter(c => c.q).map((c, i) => `<li><span class="n">${i + 1}.</span><span>${cites(c.q)}</span></li>`).join('')}</ol></div>`;

    return [`<div class="cn-grid">${C.slice(0, 3).map(cell).join('')}${asks}</div>`, ...rest].join('<!--split-->');
    return C.map((c, i) => `<div class="cn"><h4><span class="n">${i + 1}</span>${esc(c.head)}</h4>${c.list
      ? `<ol class="nl">${c.says.map((x, j) => `<li><span class="n">${j + 1}.</span><span>${say(x)}</span></li>`).join('')}</ol>`
      : `<p class="pretty">${c.says.map(say).join(' ')}</p>`}${c.q ? `<p class="cn-q"><span class="lb">Ask the team</span>${cites(c.q)}</p>` : ''}</div>`).join('<!--split-->');
